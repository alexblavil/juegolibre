// ── Card Swipe Animation — Stardew-style enhanced ────────
// ── Vertical quarantine bulkhead animation ───────────────
function drawBunkerAnim() {
  G.bunkerAnim.t++;
  const t   = G.bunkerAnim.t;
  const dur = 300; // about 5 seconds at 60fps
  const T   = Date.now();

  // World behind
  const r = room();
  cx.fillStyle = r.bg || '#020609'; cx.fillRect(0, GY, W, GH);
  drawRoom(0, GY); drawPlayer(0, GY);
  drawHUD(); drawMsgBar();

  // Full dark overlay
  const fadeA = t < 30 ? t/30 : t > dur-30 ? (dur-t)/30 : 1;
  cx.fillStyle = `rgba(0,3,6,${fadeA * 0.96})`; cx.fillRect(0, 0, W, H);

  if (t < 5 || t > dur - 5) { if (t >= dur) { const cb = G.bunkerAnim.cb; G.state='playing'; G.bunkerAnim={t:0,cb:null}; if(cb)cb(); } return; }

  const cxc = W/2, cyc = H/2 + 10;

  // ── Phase control ─────────────────────────────────────
  // 0-25:    fade in
  // 25-55:   sealed bulkhead
  // 55-165:  hands turn the wheel
  // 165-235: bulkhead swings open
  // 235-300: light floods in, fade out

  const wheelPhase  = Math.max(0, Math.min(1, (t - 55)  / 110)); // 0→1 while turning
  const openPhase   = Math.max(0, Math.min(1, (t - 165) / 70));  // 0→1 door swings
  const lightPhase  = Math.max(0, Math.min(1, (t - 225) / 45));  // 0→1 light

  // Total wheel rotation: 4 full turns, eased
  const wheelEase = wheelPhase < 0.15 ? (wheelPhase/0.15)*0.5*0.5
    : wheelPhase > 0.85 ? 1 - (1-wheelPhase)/0.15 * 0.5*0.5
    : wheelPhase;
  const wheelAngle = wheelEase * Math.PI * 8; // 4 full rotations

  // ── Background wall ───────────────────────────────────
  cx.fillStyle = '#060c10'; cx.fillRect(cxc-210, cyc-180, 420, 340);
  // Wall rivets / panels
  for (let ri = 0; ri < 4; ri++) {
    for (let ci2 = 0; ci2 < 5; ci2++) {
      cx.fillStyle = '#070d12';
      cx.fillRect(cxc - 190 + ci2*80, cyc - 170 + ri*80, 74, 74);
      cx.fillStyle = '#090f15';
      cx.fillRect(cxc - 188 + ci2*80, cyc - 168 + ri*80, 70, 70);
    }
  }
  // Wall rivets
  const rivetPositions = [];
  for (let ri=0; ri<3; ri++) for (let ci2=0; ci2<4; ci2++) rivetPositions.push([cxc-140+ci2*94, cyc-120+ri*100]);
  rivetPositions.forEach(([rx2,ry2]) => {
    cx.fillStyle='#0c1820'; cx.fillRect(rx2-3,ry2-3,6,6);
    cx.fillStyle='#152535'; cx.fillRect(rx2-2,ry2-2,4,4);
    cx.fillStyle='#1e3448'; cx.fillRect(rx2-1,ry2-1,2,2);
  });

  // ── Vertical quarantine bulkhead ───────────────────────
  const doorW = 156, doorH = 248;
  const doorX = cxc - doorW/2, doorY = cyc - doorH/2;
  const frameX = doorX - 46, frameY = doorY - 28;
  const frameW = doorW + 92, frameH = doorH + 56;

  function bulkPath(x, y, w, h, cut) {
    cx.beginPath();
    cx.moveTo(x+cut, y);
    cx.lineTo(x+w-cut, y);
    cx.lineTo(x+w, y+cut);
    cx.lineTo(x+w, y+h-cut);
    cx.lineTo(x+w-cut, y+h);
    cx.lineTo(x+cut, y+h);
    cx.lineTo(x, y+h-cut);
    cx.lineTo(x, y+cut);
    cx.closePath();
  }
  function fillBulk(x, y, w, h, cut, fill) {
    cx.fillStyle = fill;
    bulkPath(x, y, w, h, cut);
    cx.fill();
  }

  fillBulk(frameX, frameY, frameW, frameH, 30, '#0b141d');
  fillBulk(frameX+8, frameY+8, frameW-16, frameH-16, 26, '#203242');
  fillBulk(frameX+22, frameY+22, frameW-44, frameH-44, 20, '#071018');

  cx.fillStyle = '#c56f24';
  cx.fillRect(frameX+12, frameY+22, 12, frameH-44);
  cx.fillRect(frameX+frameW-24, frameY+22, 12, frameH-44);
  cx.fillStyle = '#f0d178';
  for (let sy=0; sy<6; sy++) {
    cx.fillRect(frameX+13, frameY+40+sy*40, 10, 13);
    cx.fillRect(frameX+frameW-23, frameY+60+sy*40, 10, 13);
  }

  for (let bi=0; bi<8; bi++) {
    const by2 = doorY + 18 + bi * 30;
    cx.fillStyle = '#09121a'; cx.fillRect(frameX+32, by2, 8, 8);
    cx.fillRect(frameX+frameW-40, by2, 8, 8);
    cx.fillStyle = '#2f4a5d'; cx.fillRect(frameX+34, by2+2, 4, 4);
    cx.fillRect(frameX+frameW-38, by2+2, 4, 4);
  }

  if (openPhase > 0) {
    const glow = Math.min(1, openPhase * 1.45);
    const shaft = cx.createLinearGradient(doorX, doorY, doorX+doorW, doorY);
    shaft.addColorStop(0, `rgba(30,130,170,${0.1*glow})`);
    shaft.addColorStop(0.45, `rgba(120,230,255,${0.55*glow})`);
    shaft.addColorStop(1, `rgba(20,80,110,${0.12*glow})`);
    fillBulk(doorX+18, doorY+18, doorW-36, doorH-36, 14, shaft);
    cx.fillStyle = `rgba(210,250,255,${0.28*glow})`;
    cx.fillRect(doorX+doorW*0.45, doorY+26, 12+glow*24, doorH-52);
  }

  // Door panel: vertical mamparo, swinging away from the left hinge.
  cx.save();
  if (openPhase > 0) {
    const swing = Math.sin(openPhase * Math.PI / 2);
    cx.translate(doorX, cyc);
    cx.transform(1 - swing * 0.72, 0.12 * swing, 0, 1, -swing * 42, 0);
    cx.translate(-doorX, -cyc);
  }

  cx.fillStyle = 'rgba(0,0,0,0.45)';
  fillBulk(doorX+7, doorY+8, doorW, doorH, 20, 'rgba(0,0,0,0.45)');

  const doorGrad = cx.createLinearGradient(doorX, doorY, doorX+doorW, doorY);
  doorGrad.addColorStop(0, '#31485a');
  doorGrad.addColorStop(0.45, '#1b3042');
  doorGrad.addColorStop(1, '#0d1a26');
  fillBulk(doorX, doorY, doorW, doorH, 20, doorGrad);

  fillBulk(doorX+16, doorY+18, doorW-32, doorH-36, 14, '#132536');
  fillBulk(doorX+28, doorY+36, doorW-56, doorH-72, 10, '#0b1724');
  cx.fillStyle = '#20394c';
  cx.fillRect(doorX+34, doorY+44, doorW-68, 5);
  cx.fillRect(doorX+34, doorY+doorH-50, doorW-68, 5);
  cx.fillRect(doorX+doorW/2-3, doorY+24, 6, doorH-48);

  cx.fillStyle = '#c56f24';
  cx.fillRect(doorX+18, doorY+22, 10, doorH-44);
  cx.fillRect(doorX+doorW-28, doorY+22, 10, doorH-44);
  cx.fillStyle = 'rgba(255,210,120,0.55)';
  cx.fillRect(doorX+20, doorY+26, 2, doorH-52);
  cx.fillRect(doorX+doorW-23, doorY+26, 2, doorH-52);

  for (let bi=0; bi<10; bi++) {
    const side = bi % 2 === 0 ? doorX+12 : doorX+doorW-18;
    const by2 = doorY + 18 + bi * 22;
    cx.fillStyle = '#071018'; cx.fillRect(side, by2, 7, 7);
    cx.fillStyle = '#3a5a70'; cx.fillRect(side+2, by2+2, 3, 3);
  }

  // ── Central pressure wheel ─────────────────────────────
  const wr = 30;
  cx.save();
  cx.translate(cxc, cyc);
  cx.rotate(wheelAngle);

  cx.strokeStyle = '#071018'; cx.lineWidth = 8;
  cx.beginPath(); cx.arc(0, 0, wr, 0, Math.PI*2); cx.stroke();
  cx.strokeStyle = '#2d5a78'; cx.lineWidth = 5;
  cx.beginPath(); cx.arc(0, 0, wr, 0, Math.PI*2); cx.stroke();
  for (let sp=0; sp<6; sp++) {
    const sa = (sp/6)*Math.PI*2;
    cx.strokeStyle='#10283a'; cx.lineWidth=6;
    cx.beginPath(); cx.moveTo(Math.cos(sa)*7, Math.sin(sa)*7);
    cx.lineTo(Math.cos(sa)*(wr+4), Math.sin(sa)*(wr+4)); cx.stroke();
    cx.fillStyle='#3f7894';
    cx.beginPath(); cx.arc(Math.cos(sa)*(wr+5), Math.sin(sa)*(wr+5), 5, 0, Math.PI*2); cx.fill();
  }
  cx.fillStyle='#10283a'; cx.beginPath(); cx.arc(0,0,12,0,Math.PI*2); cx.fill();
  cx.fillStyle='#4f87a6'; cx.beginPath(); cx.arc(0,0,7,0,Math.PI*2); cx.fill();

  cx.lineWidth=1;
  cx.restore(); // undo wheel rotation

  cx.restore(); // undo door swing

  // ── Hands (appear from bottom, grip wheel) ────────────
  if (wheelPhase > 0 && openPhase < 0.5) {
    const handA = Math.min(1, wheelPhase / 0.08) * (1 - openPhase*2);
    const effort = Math.sin(wheelAngle * 0.5) * 2;

    cx.globalAlpha = handA;
    const skinCol   = '#daba68';
    const skinShade = '#c8a855';
    const sleeveCol = '#1a3a5c';
    const sleeveHi  = '#224870';

    function drawGripHand(gx, gy, rot, side) {
      cx.save();
      cx.translate(gx, gy);
      cx.rotate(rot);

      // Short cuff only: no thin arm silhouette.
      cx.fillStyle = 'rgba(0,0,0,0.35)'; cx.fillRect(-17, 7, 34, 15);
      cx.fillStyle = sleeveCol; cx.fillRect(-15, 6, 30, 14);
      cx.fillStyle = sleeveHi;  cx.fillRect(-13, 7, 26, 4);
      cx.fillStyle = '#0d1d30'; cx.fillRect(-11, 3, 22, 7);

      // Palm and curled fingers.
      cx.fillStyle = skinShade; cx.fillRect(-13, -8, 26, 19);
      cx.fillStyle = skinCol;   cx.fillRect(-11, -10, 22, 17);
      cx.fillStyle = '#e8ca78'; cx.fillRect(-8, -9, 14, 4);
      cx.fillStyle = skinShade;
      for (let f=0; f<4; f++) {
        cx.fillRect(-11+f*6, -15, 5, 10);
        cx.fillStyle = skinCol; cx.fillRect(-10+f*6, -14, 3, 4);
        cx.fillStyle = skinShade;
      }
      if (side === 'left') {
        cx.fillStyle = skinShade; cx.fillRect(8, -4, 9, 7);
        cx.fillStyle = skinCol;   cx.fillRect(8, -5, 7, 5);
      } else {
        cx.fillStyle = skinShade; cx.fillRect(-17, -4, 9, 7);
        cx.fillStyle = skinCol;   cx.fillRect(-15, -5, 7, 5);
      }
      cx.fillStyle = 'rgba(70,40,10,0.22)';
      cx.fillRect(-12, 6, 24, 2);
      cx.restore();
    }

    const lGripX = cxc + Math.cos(Math.PI * 1.02) * (wr+7);
    const lGripY = cyc + Math.sin(Math.PI * 1.02) * (wr+7) + 5 + effort;
    const rGripX = cxc + Math.cos(Math.PI * -0.02) * (wr+7);
    const rGripY = cyc + Math.sin(Math.PI * -0.02) * (wr+7) - 1 - effort;
    drawGripHand(lGripX, lGripY, -0.35, 'left');
    drawGripHand(rGripX, rGripY, 0.25, 'right');

    cx.lineWidth=1;
    cx.globalAlpha=1;
  }

  // ── Light flood when door opens ────────────────────────
  if (lightPhase > 0) {
    const lA = lightPhase * 0.85;
    // Cool quarantine light from behind the vertical bulkhead.
    const lightGrad = cx.createRadialGradient(cxc, cyc, 12, cxc, cyc, doorH*0.7);
    lightGrad.addColorStop(0, `rgba(180,240,255,${lA*0.9})`);
    lightGrad.addColorStop(0.4, `rgba(100,200,240,${lA*0.5})`);
    lightGrad.addColorStop(1, `rgba(0,80,120,0)`);
    cx.fillStyle = lightGrad;
    fillBulk(doorX+18, doorY+18, doorW-36, doorH-36, 14, lightGrad);
    // White core
    cx.fillStyle = `rgba(220,245,255,${lA*0.4})`;
    fillBulk(doorX+42, doorY+42, doorW-84, doorH-84, 10, `rgba(220,245,255,${lA*0.4})`);
  }

  // ── Subtitle text ──────────────────────────────────────
  const txtA = t > 50 && t < dur-30 ? Math.min(1,(t-50)/20) * Math.min(1,(dur-30-t)/20) * fadeA : 0;
  if (txtA > 0) {
    cx.globalAlpha = txtA;
    const label = openPhase > 0.5 ? '— Acceso autorizado —'
                : wheelPhase > 0.05 ? 'Abriendo compuerta de cuarentena...'
                : '⚠  Zona de cuarentena sellada  ⚠';
    cx.fillStyle='rgba(0,10,18,0.85)'; cx.fillRect(cxc-160, cyc+130, 320, 24);
    cx.strokeStyle='rgba(0,160,200,0.4)'; cx.lineWidth=1;
    cx.strokeRect(cxc-160, cyc+130, 320, 24); cx.lineWidth=1;
    cx.fillStyle = openPhase>0.5 ? '#00eeff' : '#88bbcc';
    cx.font = 'bold 10px monospace'; cx.textAlign='center';
    cx.fillText(label, cxc, cyc+146);
    cx.textAlign='left'; cx.globalAlpha=1;
  }

  if (t >= dur) {
    const cb = G.bunkerAnim.cb;
    G.state = 'playing';
    G.bunkerAnim = { t:0, cb:null };
    if (cb) cb();
  }
}

// ── Card swipe animation ──────────────────────────────────
function drawCardAnim() {
  G.cardAnim.t++;
  const t = G.cardAnim.t;
  const dur = 200; // frames total

  // Draw game world behind
  const r = room();
  cx.fillStyle = r.bg || '#020609'; cx.fillRect(0, GY, W, GH);
  drawRoom(0, GY); drawPlayer(0, GY);
  drawHUD(); drawMsgBar();

  // Cinematic letterbox bars
  const barH = 48;
  cx.fillStyle = '#000'; cx.fillRect(0, 0, W, barH); cx.fillRect(0, H-barH, W, barH);

  // Fade overlay
  const fadeA = t < 20 ? t/20 : t > dur-20 ? (dur-t)/20 : 1;
  cx.fillStyle = `rgba(0,0,8,${fadeA * 0.88})`; cx.fillRect(0, barH, W, H-barH*2);

  if (t > 15 && t < dur-15) {
    const COLORS = {
      red:   { base:'#cc1122', mid:'#ee3344', hi:'#ff6677', glow:'255,60,80',   reader:'#ff2244' },
      blue:  { base:'#1133bb', mid:'#2255dd', hi:'#4488ff', glow:'60,120,255',  reader:'#2266ff' },
      green: { base:'#118822', mid:'#22aa33', hi:'#44ee66', glow:'60,220,100',  reader:'#22ff55' },
      yellow:{ base:'#cc9900', mid:'#ddbb00', hi:'#ffdd22', glow:'255,220,30',  reader:'#ffcc00' }
    };
    const C = COLORS[G.cardAnim.color] || COLORS.blue;
    const T = Date.now();
    const cxc = W/2, cyc = H/2;

    // ── Door frame — detailed pixel art ──────────────────
    const doorW = 120, doorH = 200;
    const dx = cxc - doorW/2 - 30, dy = cyc - doorH/2 - 5;

    // Door surround/wall section
    cx.fillStyle = '#0e1c30';
    cx.fillRect(dx-22, dy-14, doorW+44, doorH+28);
    cx.fillStyle = '#0a1520';
    cx.fillRect(dx-18, dy-10, doorW+36, doorH+20);

    // Wall panel seams
    cx.fillStyle = '#081018';
    for (let si=0; si<5; si++) {
      cx.fillRect(dx-18, dy-10+si*44, doorW+36, 2);
    }

    // Door body
    cx.fillStyle = '#142238'; cx.fillRect(dx, dy, doorW, doorH);
    // Door panel recesses
    cx.fillStyle = '#0e1a2c';
    cx.fillRect(dx+8, dy+8, 48, 90);
    cx.fillRect(dx+doorW-56, dy+8, 48, 90);
    cx.fillRect(dx+8, dy+108, 48, 84);
    cx.fillRect(dx+doorW-56, dy+108, 48, 84);
    // Panel highlights
    cx.fillStyle = '#1a2c44';
    cx.fillRect(dx+8, dy+8, 48, 3);
    cx.fillRect(dx+doorW-56, dy+8, 48, 3);
    // Center divider
    cx.fillStyle = '#0c1828';
    cx.fillRect(dx+doorW/2-3, dy+6, 6, doorH-12);
    cx.fillStyle = '#1e3652';
    cx.fillRect(dx+doorW/2-1, dy+6, 2, doorH-12);
    // Bolt corners on door
    const doorBolts = [[dx+5,dy+5],[dx+doorW-8,dy+5],[dx+5,dy+doorH-8],[dx+doorW-8,dy+doorH-8]];
    doorBolts.forEach(([bx2,by2]) => {
      cx.fillStyle='#1a2c3e'; cx.fillRect(bx2,by2,5,5);
      cx.fillStyle='#2a4060'; cx.fillRect(bx2+1,by2+1,3,3);
    });
    // Door frame edge
    cx.strokeStyle = '#1e3858'; cx.lineWidth = 2;
    cx.strokeRect(dx, dy, doorW, doorH); cx.lineWidth=1;
    cx.fillStyle='rgba(80,150,255,0.06)';
    cx.fillRect(dx, dy, doorW, doorH);

    // ── Card reader — right side ──────────────────────────
    const swipeProgress = Math.min(1, Math.max(0, (t - 45) / 75));
    const rx = dx + doorW + 24, ry = cyc - 38;

    // Reader mount plate
    cx.fillStyle = '#060810'; cx.fillRect(rx-4, ry-8, 48, 88);
    cx.fillStyle = '#0a0c18'; cx.fillRect(rx, ry, 40, 72);
    cx.strokeStyle = '#1a2838'; cx.lineWidth=1; cx.strokeRect(rx, ry, 40, 72); cx.lineWidth=1;

    // Reader slot
    cx.fillStyle = '#04060e'; cx.fillRect(rx+4, ry+6, 32, 44);
    cx.fillStyle = '#070910'; cx.fillRect(rx+5, ry+7, 30, 42);

    // LED strip (top of reader)
    for (let li2=0; li2<4; li2++) {
      const ledOn = swipeProgress > li2*0.22;
      const ledCol = ledOn ? (swipeProgress > 0.9 ? '#00ff88' : C.reader) : '#1a1a2c';
      cx.fillStyle = ledCol; cx.fillRect(rx+6+li2*7, ry+2, 5, 3);
      if (ledOn) {
        cx.fillStyle = `rgba(${swipeProgress>0.9?'0,255,136':C.glow},0.3)`;
        cx.fillRect(rx+5+li2*7, ry+1, 7, 5);
      }
    }

    // Reader label
    cx.fillStyle = '#223344'; cx.font = '6px monospace'; cx.textAlign='center';
    cx.fillText('ECHO', rx+20, ry+57);
    cx.fillText('SCAN', rx+20, ry+65);
    cx.textAlign='left';

    // Reader screen mini-display
    const rScreen = swipeProgress > 0 ? `rgba(${swipeProgress>0.9?'0,200,80':'0,80,200'},${0.5+Math.sin(T*0.01)*0.3})` : '#040608';
    cx.fillStyle = rScreen; cx.fillRect(rx+8, ry+30, 24, 14);
    if (swipeProgress > 0.1) {
      // Scanning lines
      const scanLine = ((T*0.06+swipeProgress*20)%14)|0;
      cx.fillStyle = `rgba(${swipeProgress>0.9?'0,255,100':C.glow},0.5)`;
      cx.fillRect(rx+8, ry+30+scanLine, 24, 2);
    }

    // Reader glow ambient
    if (swipeProgress > 0) {
      const rA = Math.min(1, swipeProgress*2) * (0.15+Math.sin(T*0.008)*0.06);
      const finalCol = swipeProgress > 0.9 ? '0,255,136' : C.glow;
      cx.fillStyle = `rgba(${finalCol},${rA})`;
      cx.fillRect(rx-6, ry-10, 52, 92);
    }

    // ── Card itself ────────────────────────────────────────
    const cardH = 52, cardW = 84;
    const cardX = cxc - cardW/2 + 8;
    // card slides from above into reader slot
    const cardSlideIn = swipeProgress < 0.6 ? swipeProgress/0.6 : 1;
    const cardY = ry - cardH - 8 + cardSlideIn * (cardH + 20);

    // Card shadow
    const shadA = cardSlideIn * 0.4;
    cx.fillStyle = `rgba(0,0,0,${shadA})`;
    cx.fillRect(cardX+6, cardY+cardH+2, cardW-12, 6);
    cx.fillRect(cardX+3, cardY+cardH+6, cardW-6, 4);

    // Card tilt animation (slight angle during swipe)
    cx.save();
    const tilt = (1-cardSlideIn)*0.08;
    cx.translate(cardX+cardW/2, cardY+cardH/2);
    cx.rotate(tilt);
    cx.translate(-(cardX+cardW/2), -(cardY+cardH/2));

    // Card glow aura
    if (swipeProgress > 0.05) {
      const cGlowA = (0.12+Math.sin(T*0.007)*0.06)*cardSlideIn;
      cx.fillStyle = `rgba(${C.glow},${cGlowA*3})`;
      cx.fillRect(cardX-6, cardY-4, cardW+12, cardH+8);
    }

    // Card body — layered for depth
    cx.fillStyle = C.base; cx.fillRect(cardX, cardY, cardW, cardH);
    cx.fillStyle = C.mid; cx.fillRect(cardX, cardY, cardW, cardH/2); // upper half lighter
    // Card face sheen
    cx.fillStyle = 'rgba(255,255,255,0.08)'; cx.fillRect(cardX+2, cardY+2, cardW-4, 12);
    // Holographic band
    const holoA = 0.18 + Math.sin(T*0.004)*0.12;
    cx.fillStyle = `rgba(255,255,255,${holoA})`;
    cx.fillRect(cardX+4, cardY+8, cardW-8, 6);
    cx.fillStyle = `rgba(${C.glow},0.3)`;
    cx.fillRect(cardX+4, cardY+9, cardW-8, 2);
    // Magnetic stripe (dark band)
    cx.fillStyle = '#050810'; cx.fillRect(cardX+6, cardY+18, cardW-12, 8);
    cx.fillStyle = 'rgba(80,100,200,0.3)'; cx.fillRect(cardX+7, cardY+19, cardW-14, 3);
    // Chip (EMV-style)
    cx.fillStyle = '#b08820'; cx.fillRect(cardX+8, cardY+30, 10, 8);
    cx.fillStyle = '#d4a830'; cx.fillRect(cardX+9, cardY+31, 8, 6);
    cx.fillStyle = '#987010'; cx.fillRect(cardX+9, cardY+31, 2, 6); cx.fillRect(cardX+15, cardY+31, 2, 6);
    cx.fillStyle = '#987010'; cx.fillRect(cardX+9, cardY+31, 8, 2); cx.fillRect(cardX+9, cardY+35, 8, 2);
    // Logo / ECHO text
    cx.fillStyle = C.hi; cx.font = 'bold 7px monospace'; cx.textAlign='right';
    cx.fillText('ECHO LABS', cardX+cardW-5, cardY+cardH-10);
    cx.fillStyle = 'rgba(255,255,255,0.6)'; cx.font = '5px monospace';
    cx.fillText('PROTOCOL ZERO', cardX+cardW-5, cardY+cardH-4);
    cx.textAlign='left';
    // Card edge glow strip
    cx.fillStyle = C.hi; cx.fillRect(cardX, cardY+2, 3, cardH-4);
    cx.fillStyle = `rgba(${C.glow},0.8)`;
    cx.fillRect(cardX+1, cardY+4, 1, cardH-8);
    // Card right edge shadow
    cx.fillStyle = 'rgba(0,0,0,0.3)';
    cx.fillRect(cardX+cardW-3, cardY+2, 3, cardH-4);
    // Shadow cast in card
    cx.fillStyle = 'rgba(0,0,0,0.2)';
    cx.fillRect(cardX, cardY+cardH*0.55, cardW, cardH*0.45);

    cx.restore();

    // ── Scan particles (when swiping) ─────────────────────
    if (swipeProgress > 0.2 && swipeProgress < 0.95) {
      for (let pi2=0; pi2<3; pi2++) {
        const pa = ((T*0.08 + pi2*80)%100)/100;
        const px2 = rx+4+pa*32;
        const py2 = ry+7+pa*40;
        const pA2 = Math.sin(pa*Math.PI)*0.7;
        cx.fillStyle = `rgba(${C.glow},${pA2})`;
        cx.fillRect(px2|0, py2|0, 2, 2);
      }
    }

    // ── Access granted effect ──────────────────────────────
    if (swipeProgress > 0.88) {
      const grantA = (swipeProgress - 0.88) / 0.12;

      // Big flash
      cx.fillStyle = `rgba(${C.glow},${grantA*0.12})`;
      cx.fillRect(dx-22, dy-14, doorW+44, doorH+28);

      // Door open crack (glow seam)
      const crackA = grantA * 0.9;
      const crackW = grantA * 4;
      cx.fillStyle = `rgba(${C.glow},${crackA * 0.8})`;
      cx.fillRect(dx+doorW/2-crackW, dy+6, crackW*2, doorH-12);
      cx.fillStyle = `rgba(255,255,255,${crackA*0.4})`;
      cx.fillRect(dx+doorW/2-1, dy+6, 2, doorH-12);

      // Text badge
      cx.globalAlpha = grantA;
      // badge bg
      cx.fillStyle = 'rgba(0,20,10,0.92)';
      cx.fillRect(cxc-100, dy-52, 200, 26);
      cx.strokeStyle = `rgba(${C.glow},0.8)`; cx.lineWidth=1;
      cx.strokeRect(cxc-100, dy-52, 200, 26); cx.lineWidth=1;
      // badge text
      cx.shadowColor = C.reader; cx.shadowBlur = 12;
      cx.fillStyle = swipeProgress > 0.9 ? '#00ff88' : C.hi;
      cx.font = 'bold 13px monospace'; cx.textAlign = 'center';
      cx.fillText('✓  ACCESO CONCEDIDO', cxc, dy-34);
      cx.shadowBlur = 0;
      cx.globalAlpha = 1;
    }

    cx.textAlign = 'left';
  }

  // When animation ends, trigger the callback
  if (t >= dur) {
    const cb = G.cardAnim.cb;
    G.state = 'playing';
    G.cardAnim = { t:0, color:'red', cb:null };
    if (cb) cb();
  }
}

// ── Ending C ──────────────────────────────────────────────
function drawEndC() {
  G.endT++;
  const t = G.endT;
  cx.fillStyle=`rgba(0,0,0,${Math.min(1,t/110)})`; cx.fillRect(0,0,W,H);
  if (t < 65) return;
  const ta = Math.min(1,(t-65)/65);
  cx.globalAlpha=ta;
  cx.fillStyle='#885533'; cx.font='bold 17px monospace'; cx.textAlign='center';
  cx.fillText('FIN C  —  La Huida', W/2, H/2-88);
  const ls=[
    'Noah cruzó la puerta y no miró atrás.',
    'La isla quedó envuelta en silencio.',
    '',
    'En algún lugar del laboratorio,',
    'Lena sigue esperando.',
    '',
    'Y EVA...',
    'EVA también espera.',
  ];
  cx.fillStyle='rgba(180,160,130,0.7)'; cx.font='12px monospace';
  ls.forEach((l,i)=>cx.fillText(l, W/2, H/2-18+i*19));
  if (t > 300) {
    const ba=(Math.floor(Date.now()/600)%2===0?0.88:0.3)*Math.min(1,(t-300)/70);
    cx.globalAlpha=ba;
    cx.fillStyle='#aabccc'; cx.font='11px monospace';
    cx.fillText('[ESPACIO] para volver a jugar', W/2, H-38);
  }
  cx.globalAlpha=1; cx.textAlign='left';
}

// ── Main Loop ─────────────────────────────────────────────
function update() {
  if (G.state==='credits') { G.credT++; return; }
  if (['gameover','ending_choice','note','ending_a','ending_b','ending_c','exit_confirm','card_anim','bunker_anim'].includes(G.state)) return;
  if (G.state==='playing') updatePlayer();
  if (G.state==='playing'||G.state==='dialogue') updateFoes();
  if (G.tr.state!=='idle') updateTr();
}

function render() {
  cx.fillStyle='#000'; cx.fillRect(0,0,W,H);

  if (G.state==='credits')      { drawCredits();     clearJP(); return; }
  if (G.state==='gameover')     { drawGameover();    clearJP(); return; }
  if (G.state==='ending_a')     { drawEndA();        clearJP(); return; }
  if (G.state==='ending_b')     { drawEndB();        clearJP(); return; }
  if (G.state==='ending_c')     { drawEndC();        clearJP(); return; }
  if (G.state==='exit_confirm') { drawExitConfirm(); clearJP(); return; }
  if (G.state==='card_anim')    { drawCardAnim();   clearJP(); return; }
  if (G.state==='bunker_anim')  { drawBunkerAnim(); clearJP(); return; }

  // ── Game world ──────────────────────────────────────────
  const r = room();
  cx.fillStyle = r.bg || '#020609';
  cx.fillRect(0, GY, W, GH);

  if (G.alarm) { cx.fillStyle=`rgba(180,0,0,${G.alarmA*0.45})`; cx.fillRect(0,GY,W,GH); }

  drawRoom(0, GY);

  // Items
  const p = G.P;
  const pcx = p.x+p.w/2, pcy = p.y+p.h/2;
  for (const item of (r.items||[])) {
    if (G.done.has(item.id)) continue;
    const ix=item.tx*TS+TS/2, iy=item.ty*TS+TS/2;
    drawItemAt(item, 0, GY, Math.hypot(pcx-ix,pcy-iy)<42);
  }

  for (const e of G.foes) drawDrone(e, 0, GY);
  for (const cam of (G.cameras||[])) drawCamera(cam, 0, GY);
  drawPlayer(0, GY);

  // Ambient atmosphere
  drawAmbientDust();

  // ── UI ──────────────────────────────────────────────────
  drawHUD();
  drawMsgBar();

  if (G.state==='dialogue')      drawDlg();
  if (G.state==='note')          drawNote();
  if (G.state==='ending_choice') drawEndChoice();

  // Voice toggle notification
  if (G.voiceMsgT > 0) {
    G.voiceMsgT--;
    const va = Math.min(1, G.voiceMsgT / 20);
    cx.globalAlpha = va;
    cx.fillStyle = 'rgba(0,20,40,0.9)'; cx.fillRect(W/2-90, GY+8, 180, 22);
    cx.strokeStyle = 'rgba(0,200,255,0.6)'; cx.lineWidth=1;
    cx.strokeRect(W/2-90, GY+8, 180, 22); cx.lineWidth=1;
    cx.fillStyle = '#00eeff'; cx.font = 'bold 10px monospace'; cx.textAlign='center';
    cx.fillText(G.voiceMsg, W/2, GY+23);
    cx.textAlign='left'; cx.globalAlpha=1;
  }

  // Transition overlay
  if (G.tr.state!=='idle') {
    cx.fillStyle=`rgba(0,0,0,${G.tr.alpha})`; cx.fillRect(0,0,W,H);
  }

  // Global alarm flash
  if (G.alarm) { cx.fillStyle=`rgba(200,0,0,${G.alarmA})`; cx.fillRect(0,0,W,H); }

  clearJP();
}

function loop() { update(); render(); requestAnimationFrame(loop); }

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
function startGame() {
  G.state   = 'playing';
  G.alarm   = false; G.alarmT = 0; G.alarmA = 0;
  G.tr      = { state:'idle', alpha:0, fn:null };
  G.transitioning = false;
  G.dlg     = { active:false, lines:[], li:0, ci:0, ct:0, cb:null };
  G.note    = { active:false, title:'', pages:[], pi:0 };
  G.done    = new Set();
  G.P.hp    = 3;
  G.P.cards = [];
  G.P.inv   = 0;
  G.P.walkT = 0;
  G.endT    = 0;
  G.exitConfirm = false;
  G.cameras = [];
  G.evaEliteSpawned = false;
  G.evaIdleT = 0;
  G.voiceMsg = ''; G.voiceMsgT = 0;
  G.bunkerAnim = { t:0, cb:null };
  SPEECH.stop();
  loadRoom('entrance', null, null);
}

loop();
</script>
