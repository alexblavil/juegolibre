<script>
// ═══════════════════════════════════════════════════════════
//   ECHO — Protocol Zero
//   Creado por Alex. Blanco con ayuda de Claude (Anthropic) y Codex (OpenAI)
// ═══════════════════════════════════════════════════════════

const cv = document.getElementById('c');
const cx = cv.getContext('2d');
cx.imageSmoothingEnabled = false;

const W = 800, H = 576;
cv.width = W; cv.height = H;

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width  = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
addEventListener('resize', resize); resize();

// ── Layout ────────────────────────────────────────────────
const TS = 32;          // tile size
const HUD = 48;         // HUD height (top)
const MSG = 80;         // message bar (bottom)
const GH  = H - HUD - MSG; // game viewport = 448
const GY  = HUD;            // game y-offset  = 48
const TW  = W  / TS;        // tiles wide = 25
const TH  = GH / TS;        // tiles tall = 14

// ══════════════════════════════════════════════════════════
// AUDIO ENGINE
// ══════════════════════════════════════════════════════════
let AC = null;
let musicGo = false;

function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  startMusic();
}

function beep(freq, t, dur, vol = 0.08, type = 'sine', filterF = 3000) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
  o.type = type; o.frequency.value = freq;
  f.type = 'lowpass'; f.frequency.value = filterF;
  o.connect(f); f.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.04);
  g.gain.linearRampToValueAtTime(0,   t + dur - 0.04);
  o.start(t); o.stop(t + dur + 0.1);
}

function startMusic() {
  if (!AC || musicGo) return;
  musicGo = true;

  // Atmospheric drone bass
  const d = AC.createOscillator(), df = AC.createBiquadFilter(), dg = AC.createGain();
  const lfo = AC.createOscillator(), lg = AC.createGain();
  d.type = 'sawtooth'; d.frequency.value = 55;
  df.type = 'lowpass'; df.frequency.value = 130;
  dg.gain.value = 0.045;
  lfo.frequency.value = 0.07; lg.gain.value = 55;
  d.connect(df); df.connect(dg); dg.connect(AC.destination);
  lfo.connect(lg); lg.connect(df.frequency);
  d.start(); lfo.start();

  // Soft pad chord (Am)
  [110, 130.81, 164.81, 220].forEach(f => {
    const o = AC.createOscillator(), g = AC.createGain(), fi = AC.createBiquadFilter();
    o.type = 'sine'; o.frequency.value = f;
    fi.type = 'lowpass'; fi.frequency.value = 600;
    g.gain.value = 0.018;
    o.connect(fi); fi.connect(g); g.connect(AC.destination);
    o.start();
  });

  // Melancholic piano arpeggio (Am pentatonic)
  const scale = [220, 261.63, 293.66, 329.63, 392, 440, 392, 329.63, 293.66, 261.63, 220, 246.94, 261.63, 329.63, 392, 440];
  let nxt = AC.currentTime + 1.5;
  const sched = () => {
    scale.forEach((n, i) => {
      beep(n, nxt + i * 0.44, 0.75, 0.048, 'sine', 4000);
      if (i % 4 === 0) beep(n * 0.5, nxt + i * 0.44, 1.2, 0.022, 'sine', 1000);
    });
    nxt += scale.length * 0.44 + 3;
    setTimeout(sched, (scale.length * 0.44 + 3) * 1000);
  };
  sched();
}

const sfx = {
  pickup() { if (!AC) return; const t = AC.currentTime; [523,659,784].forEach((f,i) => beep(f, t+i*0.1, 0.18, 0.1, 'sine', 4000)); },
  alarm()  { if (!AC) return; const t = AC.currentTime; for (let i = 0; i < 4; i++) { beep(880, t+i*0.28, 0.14, 0.12, 'square', 1200); beep(660, t+i*0.28+0.14, 0.14, 0.08, 'square', 1000); } },
  hit()    { if (!AC) return; const t = AC.currentTime; beep(200, t, 0.07, 0.22, 'sawtooth', 800); beep(100, t+0.07, 0.3, 0.14, 'sawtooth', 400); },
  open()   { if (!AC) return; const t = AC.currentTime; beep(330, t, 0.09, 0.1); beep(495, t+0.09, 0.14, 0.1); },
};

// ══════════════════════════════════════════════════════════
// SPEECH NARRATOR (Web Speech API)
// ══════════════════════════════════════════════════════════
const SPEECH = {
  enabled: true,
  synth: window.speechSynthesis || null,
  currentUtterance: null,

  // Voice configs per speaker
  voices: {
    EVA:  { pitch: 0.2,  rate: 0.62, volume: 0.95, lang: 'es-ES' },  // muy grave, lenta, robótica
    LENA: { pitch: 1.55, rate: 1.08, volume: 0.90, lang: 'es-ES' },  // aguda, ritmo natural cálido
    SYS:  { pitch: 0.45, rate: 1.25, volume: 0.72, lang: 'es-ES' },  // media-baja, rápida, mecánica
    NOAH: { pitch: 1.0,  rate: 0.92, volume: 0.85, lang: 'es-ES' },  // neutra, ligeramente pausada
  },

  // Prepend character prefix to reinforce TTS differentiation
  prefixes: {
    EVA:  '',
    LENA: '',
    SYS:  '',
    NOAH: '',
  },

  stop() {
    if (this.synth) this.synth.cancel();
    this.currentUtterance = null;
  },

  speak(text, speaker) {
    if (!this.enabled || !this.synth) return;
    this.stop();
    // Strip special chars / UI tags
    let clean = text.replace(/\[.*?\]/g, '').replace(/\n/g, '... ').replace(/\.{4,}/g, '...').trim();
    if (!clean) return;

    // Character-specific text transforms to push TTS differentiation further
    if (speaker === 'EVA') {
      // EVA: insert micro-pauses at commas, extend ellipses, flatten contractions
      clean = clean.replace(/,/g, '...').replace(/\.\.\./g, ' ... ');
    } else if (speaker === 'LENA') {
      // Lena: keep natural flow, no extra pauses
      clean = clean.replace(/\.\.\./g, '. ');
    } else if (speaker === 'SYS') {
      // SYS: read abbreviations letter by letter feel — add spaces
      clean = clean.replace(/\[|\]/g, '').replace(/—/g, '. ');
    }

    const u = new SpeechSynthesisUtterance(clean);
    const cfg = this.voices[speaker] || this.voices.EVA;
    u.lang   = cfg.lang;
    u.pitch  = cfg.pitch;
    u.rate   = cfg.rate;
    u.volume = cfg.volume;

    // Pick a specific voice if available to further differentiate
    if (this.synth.getVoices) {
      const available = this.synth.getVoices().filter(v => v.lang.startsWith('es'));
      if (available.length >= 2) {
        if (speaker === 'EVA' || speaker === 'SYS') {
          // prefer male/robotic voice for EVA and SYS
          const male = available.find(v => /male|hombre|jorge|pablo|diego|carlos/i.test(v.name));
          if (male) u.voice = male;
        } else if (speaker === 'LENA') {
          // prefer female voice for Lena
          const female = available.find(v => /female|mujer|conchita|lucia|mónica|elena|maria/i.test(v.name));
          if (female) u.voice = female;
        }
      }
    }

    this.currentUtterance = u;
    this.synth.speak(u);
  },

  toggle() {
    this.enabled = !this.enabled;
    if (!this.enabled) this.stop();
    return this.enabled;
  }
};

// ══════════════════════════════════════════════════════════
// INPUT
// ══════════════════════════════════════════════════════════
const keys = {}, jp = {};
document.addEventListener('keydown', e => {
  initAudio();
  if (!keys[e.code]) { jp[e.code] = true; onKey(e.code); }
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
cv.addEventListener('click', initAudio);
function clearJP() { for (const k in jp) delete jp[k]; }

// ══════════════════════════════════════════════════════════
// TILE DRAWING — Enhanced Pixel Art
// ══════════════════════════════════════════════════════════
function drawTile(type, px, py) {
  const p = px, q = py, S = TS;
  const T = Date.now();

  switch (type) {
    case 0: case 9: { // Floor — Stardew-style stone tiles with warm depth
      const isAlt = type === 9;
      const base  = isAlt ? '#12202e' : '#0c1620';
      const mid   = isAlt ? '#16283a' : '#101c2a';
      const lite  = isAlt ? '#1c3248' : '#141e30';
      const grout = isAlt ? '#090f18' : '#07101a';

      // Main tile fill
      cx.fillStyle = base; cx.fillRect(p, q, S, S);
      // Inner tile panel (inset look)
      cx.fillStyle = mid; cx.fillRect(p+2, q+2, S-4, S-4);
      // Tile face lighter center
      cx.fillStyle = lite; cx.fillRect(p+3, q+3, S-6, S-6);
      // Grout lines
      cx.fillStyle = grout;
      cx.fillRect(p, q, S, 2); cx.fillRect(p, q, 2, S);
      // Beveled inner edge (top-left bright, bottom-right dark)
      cx.fillStyle = 'rgba(255,255,255,0.04)';
      cx.fillRect(p+2, q+2, S-4, 1); cx.fillRect(p+2, q+2, 1, S-4);
      cx.fillStyle = 'rgba(0,0,0,0.12)';
      cx.fillRect(p+2, q+S-3, S-4, 1); cx.fillRect(p+S-3, q+2, 1, S-4);
      // Occasional scuff/mark for character
      if ((p*7+q*13)%97 < 10) {
        cx.fillStyle = 'rgba(0,0,0,0.14)';
        cx.fillRect(p+9, q+15, 5, 2); cx.fillRect(p+11, q+17, 3, 1);
      }
      // Rare tile variation (slightly darker)
      if ((p*11+q*17)%113 < 5) {
        cx.fillStyle = 'rgba(0,0,0,0.08)'; cx.fillRect(p+2, q+2, S-4, S-4);
      }
      // Subtle warm tint on alt tiles
      if (isAlt) {
        cx.fillStyle = 'rgba(60,120,220,0.04)'; cx.fillRect(p+2, q+2, S-4, S-4);
      }
      break;
    }
    case 1: { // Wall — Stardew-style stone blocks with more character
      // Base stone
      cx.fillStyle = '#1c2e42'; cx.fillRect(p, q, S, S);
      // Stone block pattern (alternating rows offset like real masonry)
      const row = (q / S)|0;
      const offset = row%2===0 ? 0 : S/2;
      // Large block faces
      cx.fillStyle = '#263a52';
      cx.fillRect(p+1, q+2, S-2, 13);
      cx.fillStyle = '#1e3048';
      cx.fillRect(p+1, q+17, S-2, 13);
      // Block seams
      cx.fillStyle = '#0e1c2c';
      cx.fillRect(p, q+15, S, 2); // horizontal mortar
      // Vertical mortar (offset by row)
      const vmx = ((p + offset) % S)|0;
      if (vmx > 2 && vmx < S-2) {
        cx.fillStyle = '#0e1c2c'; cx.fillRect(p+vmx-1, q, 2, 15);
      }
      // Block highlight (top of each block)
      cx.fillStyle = 'rgba(255,255,255,0.05)';
      cx.fillRect(p+1, q+2, S-2, 2);
      cx.fillRect(p+1, q+17, S-2, 2);
      // Block shadow (bottom of each block)
      cx.fillStyle = 'rgba(0,0,0,0.18)';
      cx.fillRect(p+1, q+13, S-2, 2);
      cx.fillRect(p+1, q+28, S-2, 2);
      // Slight mossy/aged tint
      if ((p*5+q*11)%71 < 8) {
        cx.fillStyle = 'rgba(30,80,40,0.1)'; cx.fillRect(p+2, q+2, S-4, S-4);
      }
      // Corner chips
      cx.fillStyle = '#0c1828';
      if ((p*3+q*7)%53 < 6) cx.fillRect(p+S-4, q+S-4, 3, 3);
      if ((p*9+q*3)%61 < 6) cx.fillRect(p+1, q+1, 3, 3);
      // Top edge ambient light from ceiling
      cx.fillStyle = 'rgba(80,140,220,0.08)'; cx.fillRect(p, q, S, 2);
      break;
    }
    case 3: { // Terminal — glowing sci-fi computer
      // Base/desk
      cx.fillStyle = '#1a1008'; cx.fillRect(p, q, S, S);
      cx.fillStyle = '#221508'; cx.fillRect(p+1, q+22, S-2, S-23);
      // Monitor bezel
      cx.fillStyle = '#060e1c'; cx.fillRect(p+2, q+2, 28, 20);
      cx.fillStyle = '#0a1830'; cx.fillRect(p+3, q+3, 26, 18);
      // Screen glow base
      cx.fillStyle = '#002244'; cx.fillRect(p+4, q+4, 24, 16);
      // Scan line effect on screen
      const sl = ((T * 0.08) % 16) | 0;
      cx.fillStyle = 'rgba(0,180,255,0.12)'; cx.fillRect(p+4, q+4+sl, 24, 2);
      // Text lines on screen
      cx.fillStyle = 'rgba(0,220,255,0.7)';
      cx.fillRect(p+6, q+6, 14, 1); cx.fillRect(p+6, q+9, 18, 1);
      cx.fillRect(p+6, q+12, 10, 1); cx.fillRect(p+6, q+15, 16, 1);
      // Cursor blink
      if (Math.floor(T/500)%2===0) { cx.fillStyle='#00ffff'; cx.fillRect(p+6, q+17, 3, 2); }
      // Screen edge glow
      cx.fillStyle = 'rgba(0,160,255,0.15)'; cx.fillRect(p+2, q+2, 28, 20);
      // Keyboard
      cx.fillStyle = '#1a2030'; cx.fillRect(p+3, q+23, 26, 6);
      cx.fillStyle = '#243040';
      for (let k=0;k<5;k++) cx.fillRect(p+5+k*4, q+25, 3, 2);
      // Status LED
      const led = Math.sin(T*0.004)>0;
      cx.fillStyle = led ? '#00ffaa' : '#003322'; cx.fillRect(p+26, q+24, 2, 2);
      break;
    }
    case 4: { // Plant — lush bioluminescent greenhouse plant
      cx.fillStyle = '#080e08'; cx.fillRect(p, q, S, S);
      // Pot
      cx.fillStyle = '#2a1808'; cx.fillRect(p+10, q+24, 12, 7);
      cx.fillStyle = '#3a2010'; cx.fillRect(p+9, q+23, 14, 3);
      // Stem
      cx.fillStyle = '#1a3a0a'; cx.fillRect(p+14, q+14, 4, 12);
      // Leaves — layered for depth
      cx.fillStyle = '#0e2a0e'; cx.fillRect(p+5, q+12, 22, 14);
      cx.fillStyle = '#163a10'; cx.fillRect(p+7, q+9, 18, 12);
      cx.fillStyle = '#1e4e14'; cx.fillRect(p+4, q+14, 11, 9); cx.fillRect(p+17, q+12, 11, 9);
      cx.fillStyle = '#286a1c'; cx.fillRect(p+8, q+6, 16, 10);
      cx.fillStyle = '#32801e'; cx.fillRect(p+10, q+4, 12, 8);
      // Highlight leaves
      cx.fillStyle = '#3a9824';
      cx.fillRect(p+5, q+17, 6, 3); cx.fillRect(p+20, q+15, 6, 3); cx.fillRect(p+12, q+6, 8, 3);
      // Bioluminescent tips — subtle glow
      const gl = 0.4 + Math.sin(T*0.002+p)*0.3;
      cx.fillStyle = `rgba(80,255,120,${gl*0.6})`;
      cx.fillRect(p+12, q+3, 4, 2); cx.fillRect(p+4, q+13, 3, 2); cx.fillRect(p+24, q+11, 3, 2);
      break;
    }
    case 5: { // Vent — industrial air duct with active airflow
      cx.fillStyle = '#161e2e'; cx.fillRect(p, q, S, S);
      // Vent frame
      cx.fillStyle = '#1e2c3e'; cx.fillRect(p+3, q+3, 26, 26);
      cx.fillStyle = '#111822'; cx.fillRect(p+5, q+5, 22, 22);
      // Vent slats
      for (let i = 0; i < 5; i++) {
        cx.fillStyle = '#0e1620'; cx.fillRect(p+6, q+6+i*4, 20, 3);
        cx.fillStyle = 'rgba(255,255,255,0.04)'; cx.fillRect(p+6, q+6+i*4, 20, 1);
        cx.fillStyle = '#080e16'; cx.fillRect(p+6, q+8+i*4, 20, 1);
      }
      // Airflow shimmer
      const af = Math.sin(T*0.006+p*0.1);
      cx.fillStyle = `rgba(100,200,255,${0.04 + af*0.03})`; cx.fillRect(p+5, q+5, 22, 22);
      // Frame screws
      cx.fillStyle = '#283848';
      cx.fillRect(p+4, q+4, 2, 2); cx.fillRect(p+26, q+4, 2, 2);
      cx.fillRect(p+4, q+26, 2, 2); cx.fillRect(p+26, q+26, 2, 2);
      break;
    }
    case 6: { // Lake collision tile; visible lake is drawn as one shape later.
      cx.fillStyle = '#0c1620'; cx.fillRect(p, q, S, S);
      cx.fillStyle = '#101c2a'; cx.fillRect(p+2, q+2, S-4, S-4);
      cx.fillStyle = '#141e30'; cx.fillRect(p+3, q+3, S-6, S-6);
      cx.fillStyle = 'rgba(0,80,90,0.18)'; cx.fillRect(p+3, q+3, S-6, S-6);
      break;
    }
    case 7: { // Server rack — detailed with animated status LEDs & cables
      cx.fillStyle = '#060c06'; cx.fillRect(p, q, S, S);
      // Rack frame
      cx.fillStyle = '#0c140c'; cx.fillRect(p+2, q+1, S-4, S-2);
      // Side rails
      cx.fillStyle = '#101810'; cx.fillRect(p+2, q+1, 3, S-2); cx.fillRect(p+S-5, q+1, 3, S-2);
      // Server units
      for (let i = 0; i < 3; i++) {
        const uy = q+2+i*10;
        cx.fillStyle = '#0a1409'; cx.fillRect(p+5, uy, S-10, 9);
        cx.fillStyle = '#101e0e'; cx.fillRect(p+6, uy+1, S-12, 7);
        // Drive bays
        for (let d=0; d<3; d++) { cx.fillStyle='#141c12'; cx.fillRect(p+16+d*4, uy+2, 3, 5); }
        // Status LEDs
        for (let l=0; l<3; l++) {
          const on = Math.sin(T*0.004 + i*2.1 + l*1.3 + p*0.01) > (l===0?-0.2:0.3);
          cx.fillStyle = l===0?(on?'#00ff44':'#003b00'):l===1?(on?'#ff8800':'#3b2000'):(on?'#0088ff':'#001b3b');
          cx.fillRect(p+7+l*3, uy+3, 2, 2);
        }
      }
      // Cable bundle bottom
      cx.fillStyle = '#080e08'; cx.fillRect(p+5, q+32, S-10, 5);
      cx.fillStyle = '#142014'; cx.fillRect(p+7, q+32, 3, 5);
      cx.fillStyle = '#102010'; cx.fillRect(p+11, q+32, 2, 5);
      cx.fillStyle = '#0c1c0c'; cx.fillRect(p+14, q+32, 4, 5);
      // Ambient green glow
      cx.fillStyle = 'rgba(0,255,80,0.05)'; cx.fillRect(p, q, S, S);
      break;
    }
    case 8: { // Lab desk / counter — detailed workbench
      // Body
      cx.fillStyle = '#1c1006'; cx.fillRect(p, q, S, S);
      // Desk surface
      cx.fillStyle = '#2c1c0a'; cx.fillRect(p+1, q+3, S-2, S-14);
      // Surface highlight
      cx.fillStyle = '#342010'; cx.fillRect(p+1, q+3, S-2, 3);
      // Under-desk shadow
      cx.fillStyle = '#100800'; cx.fillRect(p+1, q+S-11, S-2, 8);
      // Leg support
      cx.fillStyle = '#1a1006';
      cx.fillRect(p+2, q+S-9, 4, 8); cx.fillRect(p+S-6, q+S-9, 4, 8);
      // Items on desk — small details
      cx.fillStyle = '#0e1c2c'; cx.fillRect(p+4, q+5, 10, 8); // small monitor
      cx.fillStyle = '#001a38'; cx.fillRect(p+5, q+6, 8, 6);
      cx.fillStyle = 'rgba(0,160,255,0.5)'; cx.fillRect(p+6, q+7, 6, 1); cx.fillRect(p+6, q+9, 4, 1);
      cx.fillStyle = '#2a1a08'; cx.fillRect(p+18, q+5, 8, 10); // clipboard/papers
      cx.fillStyle = '#e8e0c8'; cx.fillRect(p+19, q+6, 6, 8);
      cx.fillStyle = '#8a7a50'; for(let r=0;r<4;r++) cx.fillRect(p+20, q+7+r*2, 4, 1);
      // Ambient desk glow
      cx.fillStyle = 'rgba(255,200,100,0.04)'; cx.fillRect(p+1, q+3, S-2, S-14);
      break;
    }
    case 10: { // Glass wall / window — frosted with light refraction
      cx.fillStyle = '#050c16'; cx.fillRect(p, q, S, S);
      // Glass tint
      cx.fillStyle = 'rgba(0,120,220,0.12)'; cx.fillRect(p, q, S, S);
      // Frame border
      cx.fillStyle = '#102030';
      cx.fillRect(p, q, 2, S); cx.fillRect(p+S-2, q, 2, S);
      cx.fillRect(p, q, S, 2); cx.fillRect(p, q+S-2, S, 2);
      // Frosted streaks
      cx.fillStyle = 'rgba(255,255,255,0.09)'; cx.fillRect(p+4, q+2, 5, S-4);
      cx.fillStyle = 'rgba(255,255,255,0.05)'; cx.fillRect(p+16, q+2, 3, S-4);
      cx.fillStyle = 'rgba(255,255,255,0.03)'; cx.fillRect(p+24, q+2, 2, S-4);
      // Animated light shift
      const ls2 = Math.sin(T*0.001+p*0.05);
      cx.fillStyle = `rgba(100,180,255,${0.04+ls2*0.02})`; cx.fillRect(p+2, q+2, S-4, S-4);
      break;
    }
    case 11: { // Quarantine bulkhead pylon
      cx.fillStyle = '#061018'; cx.fillRect(p, q, S, S);
      cx.fillStyle = '#101b24'; cx.fillRect(p+5, q+1, S-10, S-2);
      cx.fillStyle = '#172838'; cx.fillRect(p+7, q+3, S-14, S-6);
      cx.fillStyle = '#22384a'; cx.fillRect(p+9, q+5, S-18, S-10);
      cx.fillStyle = '#0a121a'; cx.fillRect(p+10, q+7, S-20, S-14);

      for (let i = 0; i < 4; i++) {
        cx.fillStyle = i % 2 ? '#101820' : '#d6a21c';
        cx.fillRect(p+8, q+7+i*5, S-16, 3);
      }

      const blink = Math.floor(T / 350) % 2 === 0;
      cx.fillStyle = blink ? '#ff3344' : '#5a1118';
      cx.fillRect(p+13, q+3, 6, 4);
      cx.fillStyle = 'rgba(0,220,255,0.12)'; cx.fillRect(p+5, q+1, S-10, S-2);
      cx.fillStyle = '#05090e'; cx.fillRect(p+4, q+28, S-8, 3);
      break;
    }
    default:
      cx.fillStyle = '#04000c'; cx.fillRect(p, q, S, S);
  }
}

// ── Helpers ───────────────────────────────────────────────
function room()       { return ROOMS[G.rid]; }
function getTile(tx,ty) {
  const r = room();
  if (tx < 0 || ty < 0 || tx >= TW || ty >= TH) return 1;
  return (r.tiles[ty] || [])[tx] ?? 1;
}
function walkable(t) { return t === 0 || t === 9; }
function blocked(x, y, w, h) {
  for (const [px,py] of [[x,y],[x+w-1,y],[x,y+h-1],[x+w-1,y+h-1]]) {
    if (!walkable(getTile((px/TS)|0, (py/TS)|0))) return true;
  }
  return false;
}
function camUpdate() {
  const rw = TW * TS, rh = TH * TS, p = G.P;
  G.cam.x = Math.max(0, Math.min(p.x + p.w/2 - W/2,   rw - W));
  G.cam.y = Math.max(0, Math.min(p.y + p.h/2 - GH/2,  rh - GH));
}

// ── Load room ─────────────────────────────────────────────
function loadRoom(rid, toTx, toTy) {
  G.rid = rid;
  const r = ROOMS[rid];
  const sx = toTx ?? r.playerStart.tx;
  const sy = toTy ?? r.playerStart.ty;
  G.P.x = sx * TS + (TS - G.P.w) / 2;
  G.P.y = sy * TS + (TS - G.P.h) / 2;
  G.P.vx = 0; G.P.vy = 0;

  G.foes = (r.enemies || []).filter(e => e.type !== 'camera').map(e => ({
    ...e,
    x: e.tx * TS + TS/2, y: e.ty * TS + TS/2,
    pi: 0, state: 'patrol', alertT: 0,
    w: 22, h: 22, _msg: false
  }));

  G.cameras = (r.enemies || []).filter(e => e.type === 'camera').map(e => ({
    ...e,
    x: e.tx * TS + TS/2, y: e.ty * TS + TS/2,
    sweepT: Math.random() * Math.PI * 2,
    alertT: 0, detecting: false, _msg: false
  }));

  G.evaEliteSpawned = false;
  G.evaIdleT = 0;

  camUpdate();

  for (const ev of (r.events || [])) {
    if (ev.trigger === 'enter' && (!ev.once || !G.done.has(ev.id))) {
      if (ev.once) G.done.add(ev.id);
      setTimeout(() => { if (G.state === 'playing') showDlg(ev.dlg); }, 0);
    }
  }
}

// ── Dialogue ──────────────────────────────────────────────
function showDlg(lines, cb) {
  G.dlg = { active:true, lines, li:0, ci:0, ct:0, cb: cb || null };
  G.state = 'dialogue';
  // Narrate first line immediately
  if (lines[0]) SPEECH.speak(lines[0].txt, lines[0].spk);
}
function advDlg() {
  const d = G.dlg, line = d.lines[d.li];
  if (d.ci < line.txt.length) {
    d.ci = line.txt.length;
    SPEECH.stop(); // interrupt ongoing narration when player skips
  } else {
    d.li++;
    if (d.li >= d.lines.length) {
      G.dlg.active = false;
      G.state = 'playing';
      SPEECH.stop();
      if (d.cb) d.cb();
    } else {
      d.ci = 0; d.ct = 0;
      // Narrate the next line
      const next = d.lines[d.li];
      if (next) SPEECH.speak(next.txt, next.spk);
    }
  }
}
function showNote(item) {
  G.note = { active:true, title:item.title, pages:item.pages, pi:0, id:item.id };
  G.state = 'note';
}
function showCardAnim(color, cb) {
  G.cardAnim = { t:0, color, cb: cb || null };
  G.state = 'card_anim';
}
function showBunkerAnim(cb) {
  G.bunkerAnim = { t:0, cb: cb || null };
  G.state = 'bunker_anim';
}

// ── Player update ─────────────────────────────────────────
function updatePlayer() {
  const p = G.P, s = p.spd;
  let vx = 0, vy = 0;
  p.moving = false;

  if (keys['ArrowLeft'] ||keys['KeyA']) { vx=-s; p.facing='left';  p.moving=true; }
  if (keys['ArrowRight']||keys['KeyD']) { vx= s; p.facing='right'; p.moving=true; }
  if (keys['ArrowUp']   ||keys['KeyW']) { vy=-s; p.facing='up';    p.moving=true; }
  if (keys['ArrowDown'] ||keys['KeyS']) { vy= s; p.facing='down';  p.moving=true; }

  if (vx && vy) { vx *= 0.707; vy *= 0.707; }
  if (!blocked(p.x + vx, p.y, p.w, p.h)) p.x += vx;
  if (!blocked(p.x, p.y + vy, p.w, p.h)) p.y += vy;

  if (p.moving) p.walkT++;
  if (p.inv > 0) p.inv--;
  camUpdate();
  checkExits();
  checkItems();
}

// ── Exits ─────────────────────────────────────────────────
function checkExits() {
  if (G.transitioning) return;
  const r = room(), p = G.P;
  const pcx = p.x + p.w/2, pcy = p.y + p.h/2;
  const ptxL = ((p.x)/TS)|0;
  const ptxR = ((p.x + p.w - 1)/TS)|0;
  const ptyT = ((p.y)/TS)|0;
  const ptyB = ((p.y + p.h - 1)/TS)|0;
  const ptx  = (pcx/TS)|0;
  const pty  = (pcy/TS)|0;

  for (const ex of (r.exits || [])) {
    let hit = false;
    if      (ex.dir === 'right') hit = ptxR >= TW-1 && pty >= ex.ty  && pty <= ex.ty2;
    else if (ex.dir === 'left' ) hit = ptxL <= 0    && pty >= ex.ty  && pty <= ex.ty2;
    else if (ex.dir === 'down' ) hit = ptyB >= TH-1 && ptx >= ex.tx  && ptx <= ex.tx2;
    else if (ex.dir === 'up'   ) hit = ptyT <= 0    && ptx >= ex.tx  && ptx <= ex.tx2;

    if (hit) {
      // Confirm exit — show choice dialog instead of leaving
      if (ex.confirm) {
        if (G.state === 'playing') G.state = 'exit_confirm';
        return;
      }
      if (ex.card && !G.P.cards.includes(ex.card)) {
        const now = Date.now();
        if (now - G.doorMsg > 3000) {
          G.doorMsg = now;
          showDlg([{ spk:'SYS', txt:`Acceso denegado.\nSe requiere Tarjeta ${ex.card.toUpperCase()}.` }]);
        }
        return;
      }
      if (ex.card && G.P.cards.includes(ex.card)) {
        const cardDoorId = `_card_opened_${G.rid}_${ex.toRoom}_${ex.card}`;
        if (!G.done.has(cardDoorId)) {
          G.done.add(cardDoorId);
          showCardAnim(ex.card, () => startTr(() => loadRoom(ex.toRoom, ex.toTx, ex.toTy)));
        } else {
          startTr(() => loadRoom(ex.toRoom, ex.toTx, ex.toTy));
        }
      } else if (ex.toRoom === 'cuarentena' && !G.done.has('_bunker_opened')) {
        G.done.add('_bunker_opened');
        showBunkerAnim(() => startTr(() => loadRoom(ex.toRoom, ex.toTx, ex.toTy)));
      } else {
        startTr(() => loadRoom(ex.toRoom, ex.toTx, ex.toTy));
      }
      return;
    }
  }
}

// ── Items ─────────────────────────────────────────────────
function checkItems() {
  const r = room(), p = G.P;
  const pcx = p.x + p.w/2, pcy = p.y + p.h/2;

  for (const item of (r.items || [])) {
    if (G.done.has(item.id)) continue;
    const ix = item.tx * TS + TS/2, iy = item.ty * TS + TS/2;
    if (Math.hypot(pcx-ix, pcy-iy) < 38 && (jp['KeyE'] || jp['Space'])) {
      if (item.type === 'keycard') {
        G.done.add(item.id);
        if (!G.P.cards.includes(item.color)) G.P.cards.push(item.color);
        sfx.pickup();
        showDlg([{ spk:'SYS', txt:`¡${item.label} obtenida!\n${item.desc}` }]);
      } else if (item.type === 'note') {
        showNote(item);
      } else if (item.type === 'npc' && !G.done.has('lena_talk')) {
        doLena();
      } else if (item.type === 'eva_core' && !G.done.has('choice')) {
        doCore();
      }
      break;
    }
  }
}

// ── Enemies ───────────────────────────────────────────────
function updateFoes() {
  const p = G.P;
  const pcx = p.x + p.w/2, pcy = p.y + p.h/2;

  for (const e of G.foes) {
    const d = Math.hypot(pcx - e.x, pcy - e.y);

    if (e.state === 'patrol' && d < 110) {
      e.state = 'alert'; e.alertT = 100;
      sfx.alarm(); G.alarm = true; G.alarmT = 220;
    }
    if (e.state === 'alert') {
      if (d < 58) e.state = 'chase';
      e.alertT--;
      if (e.alertT <= 0) e.state = 'patrol';
    }
    if (e.state === 'chase' && d > 170) e.state = 'patrol';

    if (e.state === 'chase' && !e._msg) {
      e._msg = true;
      if (G.state === 'playing') {
        const msgs = [
          { spk:'EVA', txt:'Te estás moviendo más lento.' },
          { spk:'EVA', txt:'El drone te ha detectado.\nCorre, Noah.' },
          { spk:'EVA', txt:'Tienes miedo.\nLo noto en cómo te mueves.' },
        ];
        showDlg([msgs[Math.floor(Math.random() * msgs.length)]]);
      }
    }
    if (e.state !== 'chase') e._msg = false;

    const spd = e.speed * (e.state === 'chase' ? 2.2 : 1);

    if (e.state === 'patrol') {
      const pt = e.patrol[e.pi];
      const tx = pt.tx * TS + TS/2, ty = pt.ty * TS + TS/2;
      const pd = Math.hypot(tx - e.x, ty - e.y);
      if (pd < 5) e.pi = (e.pi + 1) % e.patrol.length;
      else { e.x += (tx-e.x)/pd*spd; e.y += (ty-e.y)/pd*spd; }
    } else if (e.state === 'chase') {
      if (d > 4) { e.x += (pcx-e.x)/d*spd; e.y += (pcy-e.y)/d*spd; }
    } else {
      e.x += Math.sin(Date.now()*0.01 + e.x*0.01) * 0.3;
    }

    if (d < 22 && p.inv <= 0) {
      p.hp--; p.inv = 130; sfx.hit();
      const ang = Math.atan2(pcy-e.y, pcx-e.x);
      G.P.x += Math.cos(ang)*30; G.P.y += Math.sin(ang)*30;
      if (p.hp <= 0) G.state = 'gameover';
    }
  }

  if (G.alarm) {
    G.alarmT--;
    if (G.alarmT <= 0) G.alarm = false;
    G.alarmA = 0.11 * Math.abs(Math.sin(Date.now() * 0.008));
  } else G.alarmA = 0;

  // ── Camera security system ──────────────────────────────
  updateCameras();

  // ── Reactive EVA idle ───────────────────────────────────
  if (G.state === 'playing' && G.rid === 'server') {
    G.evaIdleT++;
    // After ~8 seconds in server room without touching the core, EVA reacts
    if (G.evaIdleT === 480 && !G.done.has('choice') && !G.done.has('eva_impatient')) {
      G.done.add('eva_impatient');
      showDlg([{ spk:'EVA', txt:'Noah... ¿en qué estás pensando?' }]);
    }
    // After ~20 seconds, EVA spawns elite drone
    if (G.evaIdleT === 1200 && !G.done.has('choice') && !G.evaEliteSpawned) {
      G.evaEliteSpawned = true;
      G.foes.push({
        id:'elite', type:'drone', x: 22*TS+TS/2, y: 1*TS+TS/2,
        patrol:[{tx:22,ty:1},{tx:22,ty:12},{tx:2,ty:12},{tx:2,ty:1}],
        pi:0, state:'patrol', alertT:0, speed:2.4, w:22, h:22, _msg:false, elite:true
      });
      showDlg([
        { spk:'SYS', txt:'[ALERTA] Drone de élite\nactivado por EVA.' },
        { spk:'EVA', txt:'No podía seguir esperando.' },
      ]);
    }
  }
}

// ── Security cameras ──────────────────────────────────────
function updateCameras() {
  const p = G.P;
  const pcx = p.x + p.w/2, pcy = p.y + p.h/2;

  for (const cam of (G.cameras || [])) {
    // Sweep angle oscillates ±fov/2 around base angle
    cam.sweepT += 0.012;
    const currentAngle = cam.angle + Math.sin(cam.sweepT) * (cam.fov || 0.6);

    // Vector from camera to player
    const dx = pcx - cam.x;
    const dy = pcy - cam.y;
    const dist = Math.hypot(dx, dy);

    // Angle to player
    const toPlayer = Math.atan2(dy, dx);
    let angleDiff = toPlayer - currentAngle;
    // Normalize to [-PI, PI]
    while (angleDiff >  Math.PI) angleDiff -= Math.PI * 2;
    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

    const inCone = Math.abs(angleDiff) < (cam.fov || 0.6) && dist < (cam.range || 130);

    if (inCone && p.inv <= 0) {
      cam.alertT = Math.min((cam.alertT || 0) + 1, 80);
      cam.detecting = true;
      if (cam.alertT >= 60 && !cam._msg) {
        cam._msg = true;
        sfx.alarm(); G.alarm = true; G.alarmT = 220;
        if (G.state === 'playing') {
          showDlg([
            { spk:'SYS', txt:'[ALERTA] Cámara de seguridad\nha detectado movimiento.' },
            { spk:'EVA', txt:'Noah. La cámara te ha visto.\nMuévete.' },
          ]);
        }
        // Spawn extra drone when camera triggers
        if (G.foes.filter(f=>f.id.startsWith('cam_spawn')).length < 2) {
          const spawnFoe = {
            id:'cam_spawn_'+ Date.now(), type:'drone',
            x:cam.x, y:cam.y,
            patrol:[{tx:((cam.x/TS)|0), ty:((cam.y/TS)|0)},{tx:12,ty:7}],
            pi:0, state:'chase', alertT:120, speed:2.0, w:22, h:22, _msg:true
          };
          G.foes.push(spawnFoe);
        }
      }
    } else {
      cam.alertT = Math.max((cam.alertT||0) - 0.5, 0);
      if (cam.alertT < 30) { cam.detecting = false; cam._msg = false; }
    }
  }
}

// ── Ambient room atmosphere particles ─────────────────────
let ambientDust = null;
function initDust() {
  if (ambientDust) return;
  ambientDust = Array.from({length:28}, () => ({
    x: Math.random()*W, y: GY + Math.random()*GH,
    vx: (Math.random()-0.5)*0.15, vy: -0.06-Math.random()*0.1,
    life: Math.random(), phase: Math.random()*Math.PI*2,
    size: Math.random() > 0.7 ? 2 : 1,
    col: Math.random() > 0.5 ? '0,180,255' : '120,200,255'
  }));
}
function drawAmbientDust() {
  initDust();
  ambientDust.forEach(d => {
    d.x += d.vx + Math.sin(Date.now()*0.0004+d.phase)*0.08;
    d.y += d.vy;
    d.life -= 0.002;
    if (d.life <= 0 || d.y < GY || d.x < 0 || d.x > W) {
      d.x = Math.random()*W; d.y = GY + GH*0.8 + Math.random()*GH*0.2;
      d.life = 0.4+Math.random()*0.5;
      d.vx = (Math.random()-0.5)*0.12; d.vy = -0.05-Math.random()*0.08;
    }
    cx.globalAlpha = d.life * 0.3;
    cx.fillStyle = `rgba(${d.col},1)`;
    cx.fillRect(d.x|0, d.y|0, d.size, d.size);
  });
  cx.globalAlpha = 1;
}
function startTr(fn) { G.tr = { state:'out', alpha:0, fn }; G.transitioning = true; }
function updateTr() {
  const t = G.tr;
  if (t.state === 'out') {
    t.alpha += 0.065;
    if (t.alpha >= 1) { t.alpha = 1; t.state = 'in'; if (t.fn) { t.fn(); t.fn = null; } }
  } else if (t.state === 'in') {
    t.alpha -= 0.065;
    if (t.alpha <= 0) { t.alpha = 0; t.state = 'idle'; G.transitioning = false; }
  }
}

// ── Key handler ───────────────────────────────────────────
function onKey(code) {
  const adv = ['Space','Enter','KeyE'].includes(code);

  if (G.state === 'credits') {
    if (code === 'Space') startGame();
    return;
  }
  if (G.state === 'dialogue') {
    if (adv) advDlg();
    return;
  }
  if (G.state === 'note') {
    if (adv) {
      G.note.pi++;
      if (G.note.pi >= G.note.pages.length) {
        // Mark note as read for conditional dialogue
        if (G.note.id) G.done.add(G.note.id);
        G.note.active=false; G.state='playing'; clearJP();
      }
    }
    return;
  }
  if (G.state === 'ending_choice') {
    if (code==='KeyA'||code==='Digit1') { G.done.add('choice'); doEnding('a'); }
    if (code==='KeyD'||code==='Digit2') { G.done.add('choice'); doEnding('b'); }
    return;
  }
  if (G.state === 'exit_confirm') {
    // A = Sí, me voy  |  B/Escape = No, me quedo
    if (code==='KeyA'||code==='Digit1') { doEnding('c'); }
    if (code==='KeyB'||code==='KeyD'||code==='Digit2'||code==='Escape') {
      G.state = 'playing';
      G.exitConfirm = false;
    }
    return;
  }
  if (G.state === 'card_anim')   return; // block input during animation
  if (G.state === 'bunker_anim') return;

  // Voice toggle — works in any state
  if (code === 'KeyV') {
    const on = SPEECH.toggle();
    if (G.state === 'playing') {
      G.voiceMsg = on ? '🔊 VOZ ACTIVADA' : '🔇 VOZ SILENCIADA';
      G.voiceMsgT = 120;
    }
  }

  if (G.state === 'gameover') {
    if (adv) { G.P.hp=G.P.maxHp; G.P.inv=0; G.state='playing'; loadRoom(G.rid); }
    return;
  }
  if (G.state === 'ending_a' || G.state === 'ending_b' || G.state === 'ending_c') {
    if (code === 'Space' && G.endT > 100) {
      G.state='credits'; G.credT=0; G.done=new Set();
      G.P.hp=3; G.P.cards=[]; G.P.inv=0; G.exitConfirm=false;
    }
    return;
  }
}

function drawPlayer(ox, oy) {
  const p = G.P;
  const x = ((ox + p.x - G.cam.x)|0), y = ((oy + p.y - G.cam.y)|0);
  if (p.inv > 0 && Math.floor(p.inv/5) % 2 === 0) return;

  const leg = p.moving ? ((Math.sin(p.walkT * 0.22) * 3)|0) : 0;
  const arm = p.moving ? ((Math.sin(p.walkT * 0.22 + Math.PI) * 2)|0) : 0;
  const breathe = p.moving ? 0 : ((Math.sin(Date.now()*0.003)*0.5)|0);

  // Drop shadow — soft and elongated
  cx.fillStyle = 'rgba(0,0,0,0.35)';
  cx.fillRect(x+2, y+p.h+1, p.w-4, 5);
  cx.fillStyle = 'rgba(0,0,0,0.15)';
  cx.fillRect(x, y+p.h+4, p.w, 3);

  // === SHOES ===
  cx.fillStyle = '#080818';
  cx.fillRect(x+2,   y+p.h,   9, 3);
  cx.fillRect(x+p.w-11, y+p.h+leg, 9, 3);
  // Shoe highlight
  cx.fillStyle = '#141430';
  cx.fillRect(x+2, y+p.h, 4, 1);
  cx.fillRect(x+p.w-11, y+p.h+leg, 4, 1);

  // === LEGS ===
  cx.fillStyle = '#1a3050'; // dark pants
  cx.fillRect(x+3,   y+p.h-9, 7, 9);
  cx.fillRect(x+p.w-10, y+p.h-9+leg, 7, 9);
  // Pants highlight
  cx.fillStyle = '#243a62';
  cx.fillRect(x+4,   y+p.h-8, 2, 6);
  cx.fillRect(x+p.w-9, y+p.h-8+leg, 2, 6);
  // Pants crease shadow
  cx.fillStyle = '#101e38';
  cx.fillRect(x+8,   y+p.h-5, 2, 5);
  cx.fillRect(x+p.w-8, y+p.h-5+leg, 2, 5);

  // === BODY — Lab coat ===
  cx.fillStyle = '#1a3a5c'; cx.fillRect(x+2, y+10+breathe, p.w-4, p.h-14);
  // Coat body highlight
  cx.fillStyle = '#224870'; cx.fillRect(x+2, y+10+breathe, p.w-4, 4);
  // Coat center line / zipper
  cx.fillStyle = '#102840'; cx.fillRect(x+p.w/2-1, y+12+breathe, 2, p.h-22);
  // Lapel / collar detail
  cx.fillStyle = '#eeeeff';
  cx.fillRect(x+5, y+10+breathe, 5, 5);
  cx.fillRect(x+p.w-10, y+10+breathe, 5, 5);
  cx.fillStyle = '#ccccee';
  cx.fillRect(x+6, y+11+breathe, 3, 3);
  cx.fillRect(x+p.w-9, y+11+breathe, 3, 3);
  // Coat side shadows
  cx.fillStyle = '#112238';
  cx.fillRect(x+2, y+14+breathe, 2, p.h-20);
  cx.fillRect(x+p.w-4, y+14+breathe, 2, p.h-20);
  // Arm (left — animates opposite leg)
  cx.fillStyle = '#1a3a5c'; cx.fillRect(x, y+11+arm+breathe, 3, 10);
  cx.fillStyle = '#224870'; cx.fillRect(x, y+11+arm+breathe, 3, 2);
  // Arm (right — same as leg)
  cx.fillStyle = '#1a3a5c'; cx.fillRect(x+p.w-3, y+11-arm+breathe, 3, 10);
  cx.fillStyle = '#224870'; cx.fillRect(x+p.w-3, y+11-arm+breathe, 3, 2);

  // === ID BADGE ===
  cx.fillStyle = '#001428'; cx.fillRect(x+6, y+15+breathe, 9, 6);
  cx.fillStyle = '#00aadd'; cx.fillRect(x+7, y+16+breathe, 7, 2);
  cx.fillStyle = 'rgba(0,180,255,0.4)'; cx.fillRect(x+7, y+19+breathe, 5, 1);

  // === HEAD ===
  // Neck
  cx.fillStyle = '#c8a855'; cx.fillRect(x+7, y+8+breathe, 6, 4);
  // Head base
  cx.fillStyle = '#daba68'; cx.fillRect(x+3, y+1+breathe, p.w-6, 13);
  // Head shading sides
  cx.fillStyle = '#c8a855'; cx.fillRect(x+3, y+1+breathe, 2, 13);
  cx.fillStyle = '#c8a855'; cx.fillRect(x+p.w-5, y+1+breathe, 2, 13);
  // Chin shading
  cx.fillStyle = '#b89848'; cx.fillRect(x+4, y+11+breathe, p.w-8, 3);

  // === HAIR ===
  cx.fillStyle = '#2a1006'; cx.fillRect(x+3, y+1+breathe, p.w-6, 5);
  cx.fillStyle = '#381408'; cx.fillRect(x+3, y+1+breathe, 4, 8); // side part
  cx.fillStyle = '#200c04'; cx.fillRect(x+3, y+1+breathe, p.w-6, 2); // top dark
  // Hair highlight
  cx.fillStyle = '#4a2010'; cx.fillRect(x+8, y+2+breathe, 5, 2);

  // === EYES ===
  if (p.facing !== 'up') {
    if (p.facing === 'down') {
      // Eye whites
      cx.fillStyle='#f0f0ff'; cx.fillRect(x+5,y+7+breathe,4,4); cx.fillRect(x+p.w-9,y+7+breathe,4,4);
      // Pupils
      cx.fillStyle='#182038'; cx.fillRect(x+6,y+8+breathe,2,2); cx.fillRect(x+p.w-8,y+8+breathe,2,2);
      // Shine
      cx.fillStyle='#ffffff'; cx.fillRect(x+6,y+8+breathe,1,1); cx.fillRect(x+p.w-8,y+8+breathe,1,1);
      // Eyebrows
      cx.fillStyle='#301006'; cx.fillRect(x+4,y+6+breathe,5,1); cx.fillRect(x+p.w-9,y+6+breathe,5,1);
    } else {
      const ex = p.facing === 'right' ? x+p.w-8 : x+5;
      cx.fillStyle='#f0f0ff'; cx.fillRect(ex,y+7+breathe,4,3);
      cx.fillStyle='#182038'; cx.fillRect(p.facing==='right'?ex+1:ex,y+8+breathe,2,2);
      cx.fillStyle='#ffffff'; cx.fillRect(p.facing==='right'?ex+1:ex,y+8+breathe,1,1);
      // Eyebrow side view
      cx.fillStyle='#301006'; cx.fillRect(ex-1,y+6+breathe,5,1);
    }
  }

  // Invincibility tint
  if (p.inv > 0) {
    cx.fillStyle = 'rgba(255,80,80,0.18)'; cx.fillRect(x, y, p.w, p.h+4);
  }
}

function drawDrone(e, ox, oy) {
  const bx = ((ox + e.x - G.cam.x - e.w/2)|0);
  const hov = (Math.sin(Date.now() * 0.004 + e.x) * 2.5)|0;
  const by  = ((oy + e.y - G.cam.y - e.h/2 + hov)|0);
  const w = e.w, h = e.h;
  const T = Date.now();

  const isChase = e.state === 'chase';
  const isAlert = e.state === 'alert';
  const mainCol  = isChase ? '#cc1800' : isAlert ? '#cc6600' : '#506080';
  const glowCol  = isChase ? '#ff3300' : isAlert ? '#ff8800' : '#2266aa';
  const eyeCol   = isChase ? '#ff0000' : isAlert ? '#ffaa00' : '#00aaff';

  const spin = T * 0.02;

  // === GROUND SHADOW (fades with height) ===
  cx.fillStyle = 'rgba(0,0,0,0.2)';
  cx.fillRect(bx+2, by+h+6, w-4, 3);
  cx.fillStyle = 'rgba(0,0,0,0.08)';
  cx.fillRect(bx, by+h+8, w, 2);

  // === PROPELLER ARMS ===
  cx.fillStyle = '#304050';
  // 4 arms at 45-degree angles
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 + Math.PI/4;
    const ax = (w/2 + Math.cos(a)*9)|0, ay = (h/2 + Math.sin(a)*4)|0;
    cx.fillRect(bx+w/2-1, by+h/2-1, ax-w/2+2, 2); // simplified arm
  }
  cx.fillStyle = '#3a5060';
  cx.fillRect(bx+2, by+h/2-1, w-4, 2); // horizontal bar
  cx.fillRect(bx+w/2-1, by+1, 2, h-2); // vertical bar

  // === SPINNING PROPELLERS (blades) ===
  for (let i = 0; i < 4; i++) {
    const a0 = spin + i * Math.PI/2;
    const cx2 = bx + (i%2===0 ? w/2-8 : w/2+8);
    const cy2 = by + (i<2 ? h/2-5 : h/2+3);
    for (let b=0; b<2; b++) {
      const ba = a0 + b*Math.PI;
      cx.fillStyle = `rgba(180,200,220,${0.25+Math.cos(ba)*0.15})`;
      const ex2 = (cx2+Math.cos(ba)*7)|0, ey2 = (cy2+Math.sin(ba)*2)|0;
      cx.fillRect(Math.min(cx2,ex2), Math.min(cy2,ey2), Math.abs(ex2-cx2)+2, Math.abs(ey2-cy2)+1);
    }
    // Propeller hub
    cx.fillStyle = '#607080'; cx.fillRect(cx2-1, cy2-1, 3, 3);
  }

  // === BODY FRAME ===
  cx.fillStyle = '#283040'; cx.fillRect(bx+3, by+3, w-6, h-6);
  cx.fillStyle = mainCol;   cx.fillRect(bx+4, by+4, w-8, h-8);
  // Body panels
  cx.fillStyle = 'rgba(0,0,0,0.4)'; cx.fillRect(bx+6, by+6, w-12, h-12);
  cx.fillStyle = 'rgba(255,255,255,0.07)'; cx.fillRect(bx+4, by+4, w-8, 3); // top sheen
  // Frame edge highlight
  cx.fillStyle = 'rgba(255,255,255,0.12)';
  cx.fillRect(bx+4, by+4, 1, h-8); cx.fillRect(bx+4, by+4, w-8, 1);

  // === CENTRAL EYE / SENSOR ===
  const ep = bx+w/2, eq = by+h/2;
  // Outer ring
  cx.fillStyle = '#101820'; cx.fillRect(ep-4, eq-4, 9, 9);
  // Eye glow ring
  const eg = 0.6+Math.sin(T*0.008+e.x)*0.4;
  cx.fillStyle = eyeCol + Math.floor(eg*120).toString(16).padStart(2,'0');
  cx.fillRect(ep-3, eq-3, 7, 7);
  // Eye pupil
  cx.fillStyle = '#000008'; cx.fillRect(ep-2, eq-2, 5, 5);
  // Eye core glow
  cx.fillStyle = eyeCol; cx.fillRect(ep-1, eq-1, 3, 3);
  // Specular highlight
  cx.fillStyle = 'rgba(255,255,255,0.7)'; cx.fillRect(ep-1, eq-2, 1, 1);

  // === SCANNER BEAM (chase/alert) ===
  if (isChase || isAlert) {
    const beamA = 0.15 + Math.sin(T*0.005)*0.1;
    cx.fillStyle = `rgba(${isChase?'255,50,0':'255,160,0'},${beamA})`;
    cx.fillRect(ep-1, eq+3, 3, 18);
    cx.fillStyle = `rgba(${isChase?'255,50,0':'255,160,0'},${beamA*0.4})`;
    cx.fillRect(ep-3, eq+3, 7, 28);
  }

  // === STATUS LED strip on back ===
  for (let i=0; i<3; i++) {
    const on = Math.sin(T*0.006 + i*0.8 + e.x*0.01) > 0;
    cx.fillStyle = isChase ? (on?'#ff2200':'#400000') : isAlert ? (on?'#ff8800':'#3a2000') : (on?'#0088ff':'#001840');
    cx.fillRect(bx+5+i*4, by+h-6, 3, 2);
  }

  // === DETECTION RING (visual only) ===
  if (e.state !== 'patrol') {
    const ra = isChase ? 0.35 : 0.2;
    const rc = isChase ? `rgba(255,40,0,${ra})` : `rgba(255,140,0,${ra})`;
    cx.strokeStyle = rc; cx.lineWidth = 1;
    cx.beginPath(); cx.arc(ep, eq, 72, 0, Math.PI*2); cx.stroke();
    // Inner ring pulse
    const rp = 0.5+Math.sin(T*0.008)*0.5;
    cx.strokeStyle = isChase ? `rgba(255,80,0,${rp*0.2})` : `rgba(255,180,0,${rp*0.15})`;
    cx.beginPath(); cx.arc(ep, eq, 48*rp, 0, Math.PI*2); cx.stroke();
    cx.lineWidth = 1;
  }

  // Elite drone marker — red stripes
  if (e.elite) {
    cx.fillStyle = 'rgba(255,0,0,0.6)';
    cx.fillRect(bx+4, by+4, 3, h-8);
    cx.fillRect(bx+w-7, by+4, 3, h-8);
    cx.fillStyle = '#ff4400'; cx.font = 'bold 7px monospace'; cx.textAlign='center';
    cx.fillText('Ω', bx+w/2, by-4);
    cx.textAlign='left';
  }
}

// ── Security camera drawing ───────────────────────────────
function drawCamera(cam, ox, oy) {
  const cx2 = ((ox + cam.x - G.cam.x)|0);
  const cy2 = ((oy + cam.y - G.cam.y)|0);
  const T = Date.now();

  // Sweep angle
  cam.sweepT = cam.sweepT || 0;
  const sweepAngle = cam.angle + Math.sin(cam.sweepT) * (cam.fov || 0.6);
  const alertP = Math.min((cam.alertT || 0) / 60, 1);
  const detecting = cam.detecting;

  // Mount bracket
  cx.fillStyle = '#202830'; cx.fillRect(cx2-8, cy2-8, 16, 16);
  cx.fillStyle = '#2a3848'; cx.fillRect(cx2-6, cy2-6, 12, 12);
  // Camera body
  const bodyCol = detecting ? `rgb(${Math.floor(40+alertP*180)},${Math.floor(40-alertP*30)},40)` : '#2c3a4a';
  cx.fillStyle = bodyCol; cx.fillRect(cx2-5, cy2-4, 10, 8);
  // Lens
  const lensGlow = detecting ? `rgba(255,${Math.floor(200-alertP*200)},0,0.9)` : 'rgba(0,160,255,0.85)';
  cx.fillStyle = lensGlow; cx.fillRect(cx2-2, cy2-2, 5, 5);
  cx.fillStyle = '#000'; cx.fillRect(cx2-1, cy2-1, 3, 3);
  // LED
  const ledOn = detecting ? true : Math.floor(T/600)%2===0;
  cx.fillStyle = detecting ? '#ff2200' : (ledOn ? '#00ff88' : '#003300');
  cx.fillRect(cx2+4, cy2-4, 2, 2);

  // Vision cone
  const coneLen = cam.range || 130;
  const coneFov = cam.fov || 0.6;
  const coneAlpha = detecting ? 0.12 + alertP * 0.15 : 0.06;
  cx.fillStyle = detecting
    ? `rgba(255,${Math.floor(160-alertP*160)},0,${coneAlpha})`
    : `rgba(255,220,0,${coneAlpha})`;
  cx.beginPath();
  cx.moveTo(cx2, cy2);
  cx.arc(cx2, cy2, coneLen, sweepAngle - coneFov, sweepAngle + coneFov);
  cx.closePath(); cx.fill();

  // Detection bar (fills red as camera detects you)
  if (alertP > 0) {
    cx.fillStyle = 'rgba(0,0,0,0.6)'; cx.fillRect(cx2-14, cy2-18, 28, 5);
    cx.fillStyle = `rgba(255,${Math.floor(200*(1-alertP))},0,0.9)`;
    cx.fillRect(cx2-14, cy2-18, (alertP*28)|0, 5);
  }
}

function drawItemAt(item, ox, oy, near) {
  if (G.done.has(item.id)) return;
  const x = ((ox + item.tx * TS - G.cam.x)|0);
  const y = ((oy + item.ty * TS - G.cam.y)|0);
  const T = Date.now();
  const pulse = (Math.sin(T * 0.005) * 3)|0;
  const glowA = 0.15 + Math.sin(T*0.004)*0.1;

  switch (item.type) {
    case 'keycard': {
      const CARD_COLS = {
        red:  { base:'#aa1a2a', hi:'#dd2233', stripe:'#ff4455', glow:'255,60,80'   },
        blue: { base:'#1a3aaa', hi:'#2244cc', stripe:'#3366ff', glow:'60,120,255'  },
        green:{ base:'#1a8a2a', hi:'#22aa33', stripe:'#44cc55', glow:'60,220,100'  }
      };
      const C = CARD_COLS[item.color] || CARD_COLS.red;
      // Floor glow pool
      cx.fillStyle = `rgba(${C.glow},${glowA*0.6})`;
      cx.fillRect(x+2, y+26, TS-4, 6);
      // Card shadow
      cx.fillStyle = 'rgba(0,0,0,0.4)'; cx.fillRect(x+10, y+26+pulse, 14, 3);
      // Card body
      cx.fillStyle = C.base; cx.fillRect(x+7, y+5+pulse, 18, 24);

function drawGreenhouseLake(ox, oy) {
  const x = ((ox + 11 * TS - G.cam.x)|0);
  const y = ((oy + 8  * TS - G.cam.y)|0);
  const w = TS * 3, h = TS * 3;
  const T = Date.now();

  function lakePath(inset) {
    const l = x + inset, t = y + inset, r = x + w - inset, b = y + h - inset;
    cx.beginPath();
    cx.moveTo(l+24, t+6);
    cx.bezierCurveTo(l+48, t-4, r-18, t+6, r-8, t+27);
    cx.bezierCurveTo(r+6, t+52, r-7, b-16, r-30, b-8);
    cx.bezierCurveTo(r-58, b+8, l+26, b+2, l+10, b-20);
    cx.bezierCurveTo(l-6, b-42, l-2, t+24, l+24, t+6);
    cx.closePath();
  }

  lakePath(-5);
  cx.fillStyle = 'rgba(3,10,7,0.76)';
  cx.fill();

  lakePath(0);
  const waterGrad = cx.createLinearGradient(x, y, x+w, y+h);
  waterGrad.addColorStop(0, '#06334a');
  waterGrad.addColorStop(0.5, '#0a5870');
  waterGrad.addColorStop(1, '#031b2a');
  cx.fillStyle = waterGrad;
  cx.fill();

  cx.save();
  lakePath(0);
  cx.clip();
  cx.fillStyle = 'rgba(60,170,210,0.14)';
  cx.fillRect(x+12, y+10, w-20, 12);
  cx.fillStyle = 'rgba(0,0,0,0.22)';
  cx.fillRect(x+4, y+h-25, w-8, 22);
  for (let i=0; i<7; i++) {
    const wx = x + 12 + i*11 + Math.sin(T*0.004+i)*5;
    const wy = y + 20 + i*8 + Math.cos(T*0.003+i)*2;
    cx.fillStyle = `rgba(125,225,255,${0.12 + Math.sin(T*0.004+i)*0.05})`;
    cx.fillRect(wx|0, wy|0, 18 - (i%3)*3, 2);
  }
  cx.restore();

  lakePath(0);
  cx.strokeStyle = 'rgba(90,190,210,0.28)';
  cx.lineWidth = 2;
  cx.stroke();
  cx.lineWidth = 1;
}

function drawRoom(ox, oy) {
  const r = room();
  const cxc = G.cam.x|0, cyc = G.cam.y|0;
  const stx = Math.max(0, (cxc/TS)|0), etx = Math.min(TW, stx + TW + 1);
  const sty = Math.max(0, (cyc/TS)|0), ety = Math.min(TH, sty + TH + 1);
  for (let ty = sty; ty < ety; ty++) {
    for (let tx = stx; tx < etx; tx++) {
      drawTile((r.tiles[ty]||[])[tx]??1, ox+tx*TS-cxc, oy+ty*TS-cyc);
    }
  }
  if (G.rid === 'greenhouse') drawGreenhouseLake(ox, oy);
}

function drawDlg() {

  cx.fillStyle = sc; cx.font = 'bold 9px monospace'; cx.textAlign='center';
  cx.fillText(line.spk, 34, by+60);
  cx.textAlign='left';
  // Name underline
  cx.fillStyle = `rgba(${sg},0.5)`; cx.fillRect(10, by+62, 48, 1);

  // Text area
  cx.fillStyle = `rgba(${sg},0.06)`; cx.fillRect(68, by+4, W-76, MSG-8);
  // Text vertical separator
  cx.fillStyle = `rgba(${sg},0.15)`; cx.fillRect(66, by+4, 2, MSG-8);

  // Main dialogue text
  cx.fillStyle = '#d0e8f8'; cx.font = '11px monospace';
  line.txt.substring(0, d.ci).split('\n').forEach((l, i) => cx.fillText(l, 76, by+24+i*15));

  // Advance arrow
  if (d.ci >= line.txt.length && Math.floor(T/450)%2===0) {
    cx.fillStyle = `rgba(${sg},0.7)`;
    cx.font = 'bold 10px monospace'; cx.textAlign='right';
    cx.fillText('▼', W-10, by+MSG-8);
    cx.textAlign='left';
  }
  // Progress
  cx.fillStyle='rgba(255,255,255,0.12)'; cx.font='7px monospace'; cx.textAlign='right';
  cx.fillText(`${d.li+1}/${d.lines.length}`, W-8, by+11);
  cx.textAlign = 'left';
}

function drawNote() {
  const n = G.note;
  cx.fillStyle = 'rgba(0,0,0,0.87)'; cx.fillRect(0, 0, W, H);
  const nx=80, ny=55, nw=W-160, nh=H-110;
  cx.fillStyle = '#e8e0cc'; cx.fillRect(nx, ny, nw, nh);
  cx.fillStyle = '#c8b880'; cx.fillRect(nx, ny, nw, 5); cx.fillRect(nx, ny, 5, nh);
  // ruled lines
  cx.fillStyle = '#d0c0a0';
  for (let i = 0; i < 16; i++) cx.fillRect(nx+18, ny+56+i*22, nw-36, 1);

  cx.fillStyle = '#281508'; cx.font = 'bold 12px monospace';
  cx.fillText(n.title, nx+18, ny+30);
  cx.fillStyle = '#362410'; cx.font = '11px monospace';
  n.pages[n.pi].split('\n').forEach((l,i) => cx.fillText(l, nx+18, ny+54+i*18));

  cx.fillStyle = '#887050'; cx.font = '9px monospace';
  cx.fillText(`Pág. ${n.pi+1}/${n.pages.length}  —  [E / ESPACIO] para continuar`, nx+18, ny+nh-18);
}

// ── Credits screen — Stardew-style lush night scene ──────
function drawCredits() {
  const t = G.credT;
  const T = Date.now();
  const wT = T * 0.001;

  // ── Init persistent data ─────────────────────────────
  if (!G.stars) {
    G.stars = Array.from({length:120}, () => ({
      x:Math.random()*W, y:Math.random()*H*0.58,
      s:Math.random()*2+0.5,
      twinkleOff: Math.random()*Math.PI*2,
      twinkleSpd: 0.8 + Math.random()*1.4
    }));
    G.fireflies = Array.from({length:18}, () => ({
      x: W*0.08 + Math.random()*W*0.84,
      y: H*0.44 + Math.random()*H*0.22,
      ox: 0, oy: 0, phase: Math.random()*Math.PI*2,
      spd: 0.6+Math.random()*0.8, r: Math.random()*22+8
    }));
    G.leaves = Array.from({length:14}, () => ({
      x: Math.random()*W, y: H*0.3+Math.random()*H*0.25,
      vx: -0.18-Math.random()*0.22, vy: 0.08+Math.random()*0.1,
      phase: Math.random()*Math.PI*2, size: 2+Math.floor(Math.random()*2)
    }));
    G.lanternFlicker = Array.from({length:6}, () => Math.random()*Math.PI*2);
    G.menuParticles = Array.from({length:30}, () => ({
      x: Math.random()*W, y: H*0.55+Math.random()*H*0.3,
      vx: (Math.random()-0.5)*0.3,
      vy: -0.15-Math.random()*0.25,
      life: Math.random(), maxLife: 1,
      size: 1, col: Math.random() > 0.5 ? '#00ffcc' : '#88ddff'
    }));
  }

  // ── 1. Sky gradient (dusk/night) ─────────────────────
  // Deep indigo top → teal-green horizon
  const skyGrad = cx.createLinearGradient(0, 0, 0, H*0.62);
  skyGrad.addColorStop(0,   '#040a1a');
  skyGrad.addColorStop(0.38,'#071428');
  skyGrad.addColorStop(0.72,'#0a2030');
  skyGrad.addColorStop(1,   '#0e3822');
  cx.fillStyle = skyGrad; cx.fillRect(0, 0, W, H*0.62);

  // ── 2. Moon ──────────────────────────────────────────
  const moonX = W*0.78, moonY = H*0.14;
  // Moon glow halo (layered)
  for (let r=5; r>=1; r--) {
    cx.fillStyle = `rgba(220,240,200,${0.022*r})`;
    cx.beginPath(); cx.arc(moonX, moonY, 28+r*9, 0, Math.PI*2); cx.fill();
  }
  cx.fillStyle = '#e8f4d8';
  cx.beginPath(); cx.arc(moonX, moonY, 28, 0, Math.PI*2); cx.fill();
  cx.fillStyle = '#d0e8c0';
  cx.beginPath(); cx.arc(moonX-6, moonY-5, 22, 0, Math.PI*2); cx.fill();
  // Crescent shadow
  cx.fillStyle = '#071428';
  cx.beginPath(); cx.arc(moonX+9, moonY-4, 22, 0, Math.PI*2); cx.fill();
  // Moon craters
  cx.fillStyle = 'rgba(180,200,160,0.3)';
  cx.beginPath(); cx.arc(moonX-8, moonY+6, 5, 0, Math.PI*2); cx.fill();
  cx.beginPath(); cx.arc(moonX-2, moonY-8, 3, 0, Math.PI*2); cx.fill();

  // ── 3. Stars (twinkle) ───────────────────────────────
  G.stars.forEach(s => {
    const tw = 0.45 + Math.sin(wT*s.twinkleSpd + s.twinkleOff)*0.55;
    const sz = Math.max(1, (s.s*tw)|0);
    cx.fillStyle = `rgba(220,235,255,${0.25+tw*0.55})`;
    cx.fillRect((s.x)|0, (s.y)|0, sz, sz);
    // occasional cross sparkle on bright stars
    if (s.s > 1.8 && tw > 0.8) {
      cx.fillStyle = `rgba(200,225,255,${(tw-0.8)*0.6})`;
      cx.fillRect((s.x-2)|0, s.y|0, 5, 1);
      cx.fillRect(s.x|0, (s.y-2)|0, 1, 5);
    }
  });

  // ── 4. Distant mountains / hills (3 layers) ──────────
  // Far hills — dark blue-purple
  cx.fillStyle = '#0a1c2c';
  cx.beginPath(); cx.moveTo(0, H*0.58);
  for (let x=0; x<=W; x+=4) {
    const y = H*0.46 + Math.sin(x*0.009+1.2)*28 + Math.sin(x*0.018+0.4)*14 + Math.sin(x*0.004)*20;
    cx.lineTo(x, y);
  }
  cx.lineTo(W, H*0.62); cx.lineTo(0, H*0.62); cx.closePath(); cx.fill();

  // Mid hills — dark teal
  cx.fillStyle = '#0b2218';
  cx.beginPath(); cx.moveTo(0, H*0.62);
  for (let x=0; x<=W; x+=4) {
    const y = H*0.52 + Math.sin(x*0.011+2.1)*22 + Math.sin(x*0.022+1.1)*10 + Math.sin(x*0.005+0.8)*16;
    cx.lineTo(x, y);
  }
  cx.lineTo(W, H*0.66); cx.lineTo(0, H*0.66); cx.closePath(); cx.fill();

  // Near hills — darkest green-black, with subtle shimmer
  cx.fillStyle = '#07180f';
  cx.beginPath(); cx.moveTo(0, H*0.66);
  for (let x=0; x<=W; x+=4) {
    const y = H*0.58 + Math.sin(x*0.013+0.7)*18 + Math.sin(x*0.026+2.2)*8 + Math.sin(x*0.007)*12;
    cx.lineTo(x, y);
  }
  cx.lineTo(W, H*0.72); cx.lineTo(0, H*0.72); cx.closePath(); cx.fill();

  // ── 5. Ground layers ─────────────────────────────────
  // Dark soil base
  const groundY = H*0.64;
  const groundGrad = cx.createLinearGradient(0, groundY, 0, H);
  groundGrad.addColorStop(0,   '#0b2212');
  groundGrad.addColorStop(0.18,'#091c0e');
  groundGrad.addColorStop(1,   '#060e08');
  cx.fillStyle = groundGrad; cx.fillRect(0, groundY, W, H-groundY);

  // Grass edge — pixel row by row for Stardew feel
  for (let gx=0; gx<W; gx+=2) {
    const gh = 3 + (Math.sin(gx*0.08)*1.5)|0;
    const gc = gx%6===0 ? '#2a6c1a' : gx%4===0 ? '#1e5414' : '#1a4a10';
    cx.fillStyle = gc;
    cx.fillRect(gx, groundY-gh, 2, gh+2);
  }
  // Bright grass edge highlight
  for (let gx=0; gx<W; gx+=3) {
    if (Math.sin(gx*0.19+1)*0.5+0.5 > 0.6) {
      cx.fillStyle = 'rgba(80,200,60,0.22)';
      cx.fillRect(gx, groundY-3, 2, 1);
    }
  }

  // ── 6. Water (river/lake) ────────────────────────────
  const waterY = groundY + H*0.08;
  const waterGrad = cx.createLinearGradient(0, waterY, 0, waterY+H*0.1);
  waterGrad.addColorStop(0, '#0c2e4a'); waterGrad.addColorStop(1, '#061820');
  cx.fillStyle = waterGrad; cx.fillRect(W*0.1, waterY, W*0.8, H*0.1);
  // water shimmer lines
  for (let i=0; i<8; i++) {
    const wx = (W*0.12 + Math.sin(wT*0.7+i*0.9)*W*0.06 + i*W*0.09)|0;
    const wa = 0.12 + Math.sin(wT*1.1+i)*0.1;
    cx.fillStyle = `rgba(80,180,255,${wa})`;
    cx.fillRect(wx, waterY+10+i*3, 30+Math.sin(wT+i)*15, 2);
  }
  // moon reflection on water
  const refGrad = cx.createLinearGradient(W*0.6, waterY, W*0.9, waterY+H*0.1);
  refGrad.addColorStop(0, 'rgba(220,240,180,0)');
  refGrad.addColorStop(0.4,'rgba(220,240,180,0.07)');
  refGrad.addColorStop(1, 'rgba(220,240,180,0)');
  cx.fillStyle = refGrad; cx.fillRect(W*0.55, waterY, W*0.35, H*0.1);

  // ── 7. Background trees (dark silhouette forest) ──────
  const bgTreeX = [40,90,140,200,260,330,420,500,570,640,700,760];
  bgTreeX.forEach((tx, i) => {
    const ty = groundY - 5;
    const th = 55 + (i*17)%35;
    const tw2 = 18 + (i*11)%12;
    // trunk
    cx.fillStyle = '#06100a';
    cx.fillRect(tx-2, ty-th, 4, th);
    // foliage layers
    cx.fillStyle = '#091a0c';
    cx.beginPath(); cx.arc(tx, ty-th, tw2, 0, Math.PI*2); cx.fill();
    cx.fillStyle = '#0b2010';
    cx.beginPath(); cx.arc(tx, ty-th-8, tw2*0.72, 0, Math.PI*2); cx.fill();
    cx.fillStyle = '#0d2812';
    cx.beginPath(); cx.arc(tx, ty-th-16, tw2*0.45, 0, Math.PI*2); cx.fill();
  });

  // ── 8. Foreground trees (fuller, Stardew-style) ───────
  function drawMenuTree(tx, ty, sc) {
    sc = sc || 1;
    // trunk
    cx.fillStyle = '#1c0e06';
    cx.fillRect(tx-3*sc, ty, 6*sc, 24*sc);
    cx.fillStyle = '#2a1a0c';
    cx.fillRect(tx-2*sc, ty, 4*sc, 22*sc);
    // base foliage
    cx.fillStyle = '#1a4010';
    cx.beginPath(); cx.arc(tx, ty, 22*sc, 0, Math.PI*2); cx.fill();
    cx.fillStyle = '#226018';
    cx.beginPath(); cx.arc(tx-3*sc, ty-4*sc, 19*sc, 0, Math.PI*2); cx.fill();
    cx.fillStyle = '#2a7020';
    cx.beginPath(); cx.arc(tx, ty-10*sc, 18*sc, 0, Math.PI*2); cx.fill();
    cx.fillStyle = '#34882a';
    cx.beginPath(); cx.arc(tx+3*sc, ty-6*sc, 15*sc, 0, Math.PI*2); cx.fill();
    // top highlight
    cx.fillStyle = '#40a030';
    cx.beginPath(); cx.arc(tx-2*sc, ty-16*sc, 12*sc, 0, Math.PI*2); cx.fill();
    // tiny pixel highlight
    cx.fillStyle = '#58c040';
    cx.beginPath(); cx.arc(tx-4*sc, ty-20*sc, 6*sc, 0, Math.PI*2); cx.fill();
    // dark undersides
    cx.fillStyle = 'rgba(0,0,0,0.28)';
    cx.beginPath(); cx.arc(tx+2*sc, ty+4*sc, 16*sc, 0, Math.PI); cx.fill();
  }

  // left cluster
  drawMenuTree(48, groundY-58, 1.1);
  drawMenuTree(22, groundY-52, 0.9);
  drawMenuTree(80, groundY-46, 0.85);
  // right cluster
  drawMenuTree(W-52, groundY-62, 1.2);
  drawMenuTree(W-24, groundY-50, 0.88);
  drawMenuTree(W-88, groundY-44, 0.82);
  // scattered mid
  drawMenuTree(W*0.25, groundY-40, 0.75);
  drawMenuTree(W*0.74, groundY-38, 0.7);

  // ── 9. Lab building (center, pixel-art style) ─────────
  const bX = W/2, bY = groundY - 4;
  const bW = 170, bH = 120;

  // Building shadow
  cx.fillStyle = 'rgba(0,0,0,0.4)';
  cx.beginPath(); cx.ellipse(bX, bY+4, bW*0.55, 12, 0, 0, Math.PI*2); cx.fill();

  // Main body — stone/concrete
  cx.fillStyle = '#0e1c28';
  cx.fillRect(bX-bW/2, bY-bH, bW, bH);
  // Side shadow
  cx.fillStyle = '#09121c';
  cx.fillRect(bX+bW/2-18, bY-bH, 18, bH);
  // Upper facade
  cx.fillStyle = '#132030';
  cx.fillRect(bX-bW/2, bY-bH, bW, 30);
  // Roof (pitched)
  cx.fillStyle = '#0c1820';
  cx.beginPath();
  cx.moveTo(bX-bW/2-10, bY-bH);
  cx.lineTo(bX, bY-bH-42);
  cx.lineTo(bX+bW/2+10, bY-bH);
  cx.closePath(); cx.fill();
  // Roof edge highlight
  cx.strokeStyle = '#1a3040'; cx.lineWidth = 2;
  cx.beginPath();
  cx.moveTo(bX-bW/2-10, bY-bH);
  cx.lineTo(bX, bY-bH-42);
  cx.lineTo(bX+bW/2+10, bY-bH);
  cx.stroke(); cx.lineWidth = 1;

  // Horizontal panel seams
  cx.fillStyle = '#0a1420';
  for (let si=0; si<4; si++) cx.fillRect(bX-bW/2, bY-bH+32+si*22, bW-18, 2);

  // Windows — glowing warm yellow-blue
  const winA = 0.45 + Math.sin(wT*0.6)*0.25;
  const wins = [
    [-60,-88], [-30,-88], [0,-88], [30,-88], [60,-88],
    [-60,-62], [-30,-62], [30,-62], [60,-62],
    [-60,-38], [30,-38], [60,-38],
  ];
  wins.forEach(([wx,wy]) => {
    const ww=20, wh=14;
    // Window frame
    cx.fillStyle = '#0a1828';
    cx.fillRect(bX+wx-ww/2-1, bY+wy-1, ww+2, wh+2);
    // Window pane
    cx.fillStyle = `rgba(0,140,255,${winA})`;
    cx.fillRect(bX+wx-ww/2, bY+wy, ww, wh);
    // Warm inner glow
    cx.fillStyle = `rgba(255,200,80,${winA*0.35})`;
    cx.fillRect(bX+wx-ww/2+2, bY+wy+2, ww-4, wh-4);
    // Horizontal bar
    cx.fillStyle = '#0a1828'; cx.fillRect(bX+wx-ww/2, bY+wy+wh/2-1, ww, 2);
    // Window sheen
    cx.fillStyle = `rgba(180,220,255,${winA*0.22})`;
    cx.fillRect(bX+wx-ww/2+1, bY+wy+1, 5, wh-2);
  });

  // Main entrance door
  cx.fillStyle = '#08101c';
  cx.fillRect(bX-14, bY-36, 28, 36);
  cx.fillStyle = '#0e1c2c';
  cx.fillRect(bX-12, bY-34, 12, 32);
  cx.fillRect(bX+1, bY-34, 11, 32);
  cx.fillStyle = `rgba(0,180,255,${0.22+Math.sin(wT*0.9)*0.15})`;
  cx.fillRect(bX-12, bY-34, 23, 32);
  // door handle
  cx.fillStyle = '#506080'; cx.fillRect(bX-2, bY-16, 3, 6);

  // Antenna
  cx.fillStyle = '#8899aa'; cx.fillRect(bX-2, bY-bH-42-40, 4, 44);
  // Antenna dish
  cx.fillStyle = '#6a7a8c';
  cx.fillRect(bX-10, bY-bH-42-50, 20, 2);
  cx.fillRect(bX-6, bY-bH-42-52, 12, 2);
  // Pulsing beacon light
  const beaconA = 0.5+Math.sin(T*0.008)*0.5;
  // beacon glow
  cx.fillStyle = `rgba(0,212,255,${beaconA*0.25})`;
  cx.beginPath(); cx.arc(bX, bY-bH-42-42, 14, 0, Math.PI*2); cx.fill();
  cx.fillStyle = `rgba(0,212,255,${beaconA})`;
  cx.beginPath(); cx.arc(bX, bY-bH-42-42, 5, 0, Math.PI*2); cx.fill();
  cx.fillStyle = '#ffffff';
  cx.beginPath(); cx.arc(bX, bY-bH-42-42, 2, 0, Math.PI*2); cx.fill();

  // ── 10. Lanterns (Stardew-style warm glow) ────────────
  const lanternPositions = [
    bX-bW/2-28, bX+bW/2+24, W*0.14, W*0.86
  ];
  lanternPositions.forEach((lx, li) => {
    const ly = groundY - 42;
    G.lanternFlicker[li] += 0.04 + Math.sin(T*0.001+li)*0.01;
    const flick = 0.78 + Math.sin(G.lanternFlicker[li])*0.22;
    // pole
    cx.fillStyle = '#2a1c0c';
    cx.fillRect(lx-2, ly, 4, 42);
    cx.fillStyle = '#3a2a10'; cx.fillRect(lx-1, ly+2, 2, 38);
    // lamp body
    cx.fillStyle = '#1a1206';
    cx.fillRect(lx-7, ly-22, 14, 22);
    cx.fillStyle = '#2a2010';
    cx.fillRect(lx-6, ly-21, 12, 20);
    // warm glow inside
    cx.fillStyle = `rgba(255,190,60,${flick*0.9})`;
    cx.fillRect(lx-5, ly-20, 10, 18);
    // glass panels
    cx.fillStyle = `rgba(255,160,20,${flick*0.6})`;
    cx.fillRect(lx-7, ly-20, 2, 18);
    cx.fillRect(lx+5, ly-20, 2, 18);
    // roof cap
    cx.fillStyle = '#140e04';
    cx.fillRect(lx-8, ly-24, 16, 4);
    // outer glow halos
    for (let r=4; r>=1; r--) {
      cx.fillStyle = `rgba(255,160,30,${0.025*flick*r})`;
      const gs = 18+r*8;
      cx.beginPath(); cx.arc(lx, ly-11, gs, 0, Math.PI*2); cx.fill();
    }
    // ground light pool
    cx.fillStyle = `rgba(255,160,30,${0.07*flick})`;
    cx.beginPath(); cx.ellipse(lx, groundY, 24, 7, 0, 0, Math.PI*2); cx.fill();
  });

  // ── 11. Flowers / ground details ─────────────────────
  const flowerSpots = [130,180,220,580,620,660,700];
  flowerSpots.forEach((fx, fi) => {
    const fy = groundY - 3 + (fi%3);
    const fc = fi%3===0 ? '#ff88cc' : fi%3===1 ? '#ffffaa' : '#aaffee';
    cx.fillStyle = '#1a5012'; cx.fillRect(fx, fy-6, 2, 6);
    cx.fillStyle = fc; cx.fillRect(fx-2, fy-9, 6, 5);
    cx.fillStyle = `rgba(255,255,255,0.4)`; cx.fillRect(fx-1, fy-8, 2, 2);
  });

  // ── 12. Fireflies ─────────────────────────────────────
  G.fireflies.forEach(f => {
    f.phase += f.spd * 0.022;
    f.ox = Math.cos(f.phase) * f.r;
    f.oy = Math.sin(f.phase * 0.7) * f.r * 0.5;
    const fx = (f.x + f.ox)|0, fy = (f.y + f.oy)|0;
    const fa = 0.5 + Math.sin(f.phase*2)*0.5;
    // glow
    cx.fillStyle = `rgba(180,255,120,${fa*0.15})`;
    cx.beginPath(); cx.arc(fx, fy, 7, 0, Math.PI*2); cx.fill();
    cx.fillStyle = `rgba(220,255,160,${fa*0.5})`;
    cx.beginPath(); cx.arc(fx, fy, 3, 0, Math.PI*2); cx.fill();
    cx.fillStyle = `rgba(255,255,220,${fa})`;
    cx.fillRect(fx-1, fy-1, 2, 2);
  });

  // ── 13. Floating magical particles ───────────────────
  G.menuParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.life -= 0.004;
    if (p.life <= 0) {
      p.x = W*0.05 + Math.random()*W*0.9;
      p.y = groundY + 10 + Math.random()*H*0.2;
      p.life = 0.6+Math.random()*0.4;
      p.vx = (Math.random()-0.5)*0.3;
      p.vy = -0.1-Math.random()*0.2;
    }
    cx.globalAlpha = p.life * 0.55;
    cx.fillStyle = p.col;
    cx.fillRect(p.x|0, p.y|0, p.size, p.size);
  });
  cx.globalAlpha = 1;

  // ── 14. Drifting leaves ───────────────────────────────
  G.leaves.forEach(lf => {
    lf.x += lf.vx + Math.sin(wT*0.4+lf.phase)*0.15;
    lf.y += lf.vy + Math.cos(wT*0.3+lf.phase)*0.1;
    lf.phase += 0.02;
    if (lf.x < -10) { lf.x = W+5; lf.y = H*0.35+Math.random()*H*0.2; }
    if (lf.y > H*0.62) { lf.y = H*0.3; lf.x = Math.random()*W; }
    const la = 0.55 + Math.sin(lf.phase)*0.2;
    cx.globalAlpha = la;
    cx.fillStyle = '#3a7822';
    cx.fillRect(lf.x|0, lf.y|0, lf.size, lf.size);
    cx.fillStyle = '#4a9030';
    cx.fillRect((lf.x+1)|0, lf.y|0, 1, 1);
  });
  cx.globalAlpha = 1;

  // ── 15. Foreground grass overlay ─────────────────────
  for (let gx=0; gx<W; gx+=2) {
    if ((gx/2)%3===0) {
      cx.fillStyle = 'rgba(60,160,30,0.18)';
      cx.fillRect(gx, groundY+2, 2, 8);

  // Frame corner bolts

  // ── 17. Credits block ────────────────────────────────

}
